# One Postgres instance for staging, run by the CloudNativePG operator that is
# already installed on the node (namespace cnpg-system). The operator creates
# Secret `hexagen-pg-app` (keys include `uri`, `host`, `username`, `password`)
# and Service `hexagen-pg-rw`; nothing in this repo holds a credential.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hexagen-pg
  labels:
    app: hexagen-pg
spec:
  # One instance: staging has one node, so a replica would share its disk and
  # add nothing. There is no failover; a pod restart is a short outage.
  instances: 1
  # Postgres 18, the same major version as the lane test server, so staging and
  # the tests run one dialect.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: hexagen
      owner: hexagen
      encoding: UTF8
      localeCollate: C
      localeCType: C
  storage:
    # local-path does not enforce the size and cannot expand a claim, so this
    # is documentation more than a limit. The StorageClass has
    # reclaimPolicy: Delete: deleting this Cluster's claim deletes the data.
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
