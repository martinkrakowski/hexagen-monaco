# A nightly logical dump of the staging database, seven kept. The dump is
# written under a temporary name, read back in full with pg_restore, and only
# then given its final name, so a file named *.dump is always a readable one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hexagen-pg-dump
  labels:
    app: hexagen-pg
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: hexagen-pg-dump
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              # The cluster's own image, so pg_dump matches the server version.
              image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
              imagePullPolicy: IfNotPresent
              env:
                - name: PGURI
                  valueFrom:
                    secretKeyRef:
                      name: hexagen-pg-app
                      key: uri
              command:
                - /bin/sh
                - -euc
                - |
                  # A scheduled run and a hand-started one can overlap, so each
                  # run writes to its own temporary name, and only a *.part older
                  # than a run can live (the 900 s deadline, with margin) is
                  # treated as left behind by a killed run. This run removes its
                  # own on any failure, so a failure never eats the disk.
                  find /dumps -name '*.part' -mmin +20 -delete
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  final=/dumps/hexagen-$stamp.dump
                  part=$(mktemp "/dumps/hexagen-$stamp.XXXXXX.part")
                  trap 'rm -f "$part"' EXIT
                  pg_dump --format=custom --no-owner --file="$part" "$PGURI"
                  # Read the whole archive, data included, not only its table of
                  # contents. This proves it is readable, not that it restores.
                  pg_restore --file=/dev/null "$part"
                  mv "$part" "$final"
                  # Keep the seven newest.
                  ls -1t /dumps/hexagen-*.dump | tail -n +8 | xargs -r rm -f
                  ls -l /dumps
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: hexagen-pg-dumps
