# PR-Agent — UI-contract specialist. Complements CodeRabbit and Qodo; does not
# replace them. Read from the repo default branch (not the PR head).
#
# https://docs.pr-agent.ai/usage-guide/configuration_options/

[config]
restricted_mode = true
model = "openrouter/inception/mercury-2"
# WAS openrouter/anthropic/claude-3.5-sonnet, which does NOT exist in the
# OpenRouter catalogue — so the fallback path could not have resolved. A
# fallback that 404s is worse than none: it only fails when the primary is
# already failing. Verified against /api/v1/models; claude-haiku-4.5 is
# present with a 200000 window, which comfortably serves the budget below.
# Kept. With custom_model_max_tokens now 128000 the fallback is UNDER-declared
# (haiku-4.5 holds 200000), which is the safe direction -- PR-Agent will simply
# use less of it than it could. The reverse, which the previous config had, is
# the dangerous one: 262144 declared against haiku's real 200000 would have had
# it build a prompt the model could not accept, and the fallback has never
# fired, so nobody would have found out until it mattered.
fallback_models = ["openrouter/anthropic/claude-haiku-4.5"]
# The ACTIVE model's real window, from OpenRouter's own catalogue:
#   inception/mercury-2  context_length = 128000, max_completion_tokens = 50000
#
# Historical, so the numbers below are not read against the wrong model: this
# was 64000 (a silent ceiling, since max_model_tokens can never exceed what the
# model is declared to hold), then 262144 for tencent/hy3. Neither applies now.
# mercury-2's REAL window from OpenRouter's catalogue: 128000, with a 50000
# completion cap. This MUST NOT exceed it. Over-declaring is the failure mode
# nobody notices until it bites: PR-Agent builds a prompt to fit a window the
# model does not have, and the provider truncates or rejects. The previous
# 262144 was hy3's window and would have been a live over-claim the moment the
# model changed.
custom_model_max_tokens = 128000
# THE setting that was pruning diffs. `custom_model_max_tokens` declares what
# the model can hold; `max_model_tokens` caps what PR-Agent will actually use,
# and it defaults to 32000 REGARDLESS of the model's capacity. So the 64000
# above was never reached and reviews silently dropped files:
#
#   Tokens: 36247, total tokens over limit: 32000, pruning diff.
#   After pruning, added_list_str: Additional added files (insufficient token
#   budget to process): … useLayoutRatify.ts …
#
# On #598 the pruned set included useLayoutRatify.ts — the one file in that PR
# that contained a crash (an infinite render loop). The review reported "no
# major issues" without ever reading it, which is worse than no review: a
# green check that looks like coverage.
#
# Observed peaks were modest — 36247 tokens (6 files) and 37977 (11 files),
# against the old 32000 cap. The point is that a large PR is never silently
# truncated and pr-agent spends only what the diff actually needs -- but the
# ceiling is now mercury-2's 128000 window, not hy3's 262144, so the budget is
# set by the arithmetic below rather than by how much headroom we would like.
# The fallback (haiku-4.5, 200000) self-limits, since pr-agent takes the min.
# Was 200000, chosen deliberately to stop diffs being pruned. mercury-2 cannot
# hold that, so this is a forced reduction rather than a preference.
#
# The number is bounded by ARITHMETIC, not by taste. The window is 128000 TOTAL
# — prompt plus completion — and mercury-2's completion cap is 50000. So the
# prompt budget must leave room for a completion that large:
#
#     70000 prompt  +  50000 completion  =  120000  <  128000  ✔
#     96000 prompt  +  50000 completion  =  146000  >  128000  ✘
#
# 96000 was the first value here and could overflow in the worst case. 70000
# cannot, and is still more than twice the largest prompt observed on this repo
# (~12k of repo context files plus a ~20k diff on the biggest PR), so it does
# not reintroduce pruning.
#
# In practice completions are far under the cap — reasoning_effort is "low"
# and suggestion bodies are a few thousand tokens —
# but a budget that only holds while the model is well behaved is not a budget.
max_model_tokens = 70000
repo_context_files = [
  ".agents/PR_REVIEW_RUBRIC.md",
  "best_practices.md",
  "DESIGN.md",
]
repo_context_from_default_branch = true
# Raised from the default 500 so the rubric, best_practices.md, and DESIGN.md
# all fit (DESIGN.md alone is ~810 lines).
repo_context_max_lines = 3000

# Bound the LLM call inside the container so fallback_models can engage on a
# slow model. Without it the only deadline is the workflow's timeout-minutes,
# which kills the job and attempts no fallback. See the workflow env block for
# the caveat: an 812s call completed despite the documented 120s default.
ai_timeout = 600

[github_action_config]
# SWAPPED — see the workflow env block, which overrides this file until both
# are on the default branch. /review emits only the "PR Reviewer Guide": an
# effort estimate, a security flag, and a focus-areas section that is empty
# whenever it has nothing to say. It never produces line-anchored suggestions,
# however it is configured. The reviews this bot exists for come from /improve.
auto_review = false
auto_describe = false
auto_improve = true
pr_actions = ["opened", "reopened", "ready_for_review"]

[pr_reviewer]
# OFF. It treats any `#NNN` in the PR body as a ticket this PR must IMPLEMENT,
# with no notion of a cross-reference. Measured 3/3 correlation:
#
#   #594  no #NNN in body        -> no ticket block
#   #595  cites #594             -> 8 false "non-compliant requirements"
#   #596  cites #594, #595       -> 2 false blocks
#
# On #595 it declared the PR non-compliant for not implementing BF-6.2 — a
# different packet, referenced only as the sibling that completes the MVP. The
# output is long and authoritative, so it costs more review attention than it
# saves, and it penalises exactly the PRs that document their reasoning.
require_ticket_analysis_review = false
# Unique job: DESIGN.md UI contracts the linter cannot cheaply catch.
# Verifier defects, assertion-style, and ADR inventory comments belong to
# CodeRabbit / Qodo — do not duplicate them.
extra_instructions = """
You are the UI-contract reviewer for this repository. Enforce DESIGN.md.
Do not re-raise findings that belong to CodeRabbit or Qodo (verifier
defects, assertion-style, manifest inventory completeness).
Cite DESIGN.md section numbers. Do not paraphrase a rule that already
has a section; name it.
When you propose a fix, say what it does to inputs the current code
already handles — particularly whether it turns a loud failure into a
quiet one.
"""

[pr_code_suggestions]
# Inline and line-anchored rather than one collapsed summary table (the 0.42.0
# default), because the summary format reads as "nothing happened" even when it
# found something.
commitable_code_suggestions = true
# No comment when there is nothing to say. The default (true) is what posted an
# empty guide on every PR; silence is a better signal than three vague rows.
publish_output_no_suggestions = false
# On by default in 0.42.0, pinned so a future image cannot quietly turn this
# into a style-nitpicker.
focus_only_on_problems = true
# Depth. Defaults (3 and 3) process only part of a large diff and stop at three
# findings per section. Doubling both is what "highly detailed" costs; the job's
# timeout-minutes: 15 bounds it.
num_code_suggestions_per_chunk = 6
max_number_of_calls = 6
# PINNED, not inherited. The workflow's 25-minute timeout is justified by
# wall-clock being the slowest single call rather than the sum of six, which
# holds only while chunks run in parallel. That is the 0.42.0 default, but an
# image bump that flipped it would turn six chunks at the observed 812s into
# ~81 minutes against a 25-minute cap.
parallel_calls = true
# Deliberately 0. Filtering by score is the opposite of adversarial:
# focus_only_on_problems already excludes style noise, so anything this removed
# would be a real finding that happened to score low.
suggestions_score_threshold = 0
extra_instructions = """
You are the adversarial UI-contract reviewer for this repository. Your job is
to find defects, not to summarise the PR. Assume the code is wrong and look
for the input that proves it.

Every finding MUST carry a concrete failure scenario: specific inputs or
state, and the wrong output, crash, or silent no-op that results. "This could
be fragile" is not a finding. "With `note: ""` the cell renders blank, which
reads as a value rather than a missing reading" is a finding.

Hunt these classes first. They are the ones that have actually shipped here:

1. GATES THAT PASS WITHOUT RUNNING. A guard that asserts a population is
   clean without first asserting the population is non-empty. A loop that
   iterates zero times and reports success. A config glob that matches no
   files and is silently dropped. A check whose fixture creates the very
   thing it then verifies exists.
2. LOUD FAILURES MADE QUIET. A catch that swallows, returns null/false/[],
   or coerces an unknown value to a default. Ask of every catch: can the
   caller distinguish "nothing was wrong" from "I could not tell"?
3. TESTS THAT CANNOT FAIL. Would this test fail if the code under it were
   wrong? Mocked or injected past the line that actually breaks in
   production? Asserting an absence after an unchecked write?
4. RUNTIME/BUILD DIVERGENCE. Something present in dev and absent in the
   packaged artifact, or built on one Node major and run on another.
5. DESIGN.md VIOLATIONS. Spacing must resolve to the §4.7 scale
   (1,2,3,4,6,8,12,16) -- fractional Tailwind steps like mt-0.5 or gap-1.5
   are violations and no gate catches them inside features/. Do not invent
   tokens, utilities, or exception patterns absent from §4.8 / §4.9. Cite
   section numbers; never paraphrase a rule that has one.

For every fix you propose, state explicitly what it does to inputs the
current code already handles, and whether it converts a loud failure into a
quiet one. A fix that trades a crash for a wrong answer is worse than the bug.

Do not re-raise what CodeRabbit and Qodo own (verifier defects,
assertion-style, manifest inventory completeness). Do not comment to
acknowledge, praise, or summarise. Prefer silence to a speculative finding:
one real defect is worth more than five plausible ones, and a wrong finding
costs a human more time than it saves.
"""

[ignore]
# Generated build artefacts only. Do not ignore .architecture/** (accuracy
# defects are in-scope for other bots; this one simply must not propose
# edits there) or packages/template-engine/templates/** (shipped customer
# payload — see best_practices.md). @generated barrels are a content
# marker, not a path glob — handled in the rubric.
glob = ['**/dist/**', '**/*.tsbuildinfo', 'yarn.lock']

[openrouter]
# WHY THIS SECTION EXISTS: it did not, and four knobs that govern wall-clock
# time were therefore at their defaults.
#
# `tencent/hy3` is a REASONING model — its OpenRouter `supported_parameters`
# carry `reasoning` and `reasoning_effort`. With no `[openrouter]` block,
# PR-Agent leaves `reasoning_effort` empty (= the model's own default) and
# `reasoning_max_tokens` at 0 (= no budget at all), so the length of the
# thinking phase was chosen by the model and bounded by nothing.
#
# That matches the measurements far better than "the provider is slow" does.
# Single-chunk /improve runs on 2026-08-23, same config, same repo:
#
#   #620   165 patch lines, YAML config .................... 110s
#   #621  1400 patch lines, new module + prose comments .... 121s
#   #619         React hooks, race conditions .............. 365s
#   #617  1343 patch lines, Tailwind token-parsing regex ... 812s
#   #618         killed at the 15-minute cap ............... 912s
#
# #621 and #617 are the control pair: near-identical input SIZE, 6.7x apart in
# duration. Input size does not predict the time; problem DIFFICULTY does, and
# that is the signature of reasoning length rather than of network latency.
#
# Deliberately changing ONE mechanism here. Provider routing is the other
# uncontrolled knob — hy3 serves from Baidu, GMICloud and Tencent, and nothing
# pins which — but changing both at once would make the result unattributable.
# If capping reasoning does not fix it, add:
#     provider_order = ["tencent"]
#     allow_fallbacks = true
# and measure again. `provider_only` is deliberately NOT the first reach: it is
# a hard allowlist with no escape, so a provider outage becomes a failed request
# that falls through to `fallback_models` — which carries its own open defect
# (see the note on custom_model_max_tokens vs claude-haiku-4.5's 200k window).
# EXACTLY ONE of these, never both. OpenRouter's reasoning API documents them
# as mutually exclusive -- "one of the following (not both)" -- and sending
# both makes the request invalid, so the provider rejects it outright.
#
# #622 set both. The result was not an error anyone saw: PR-Agent posted
# "Failed to generate code suggestions for PR" and the job exited 0, so the
# check went GREEN for a review that never happened. Evidence, two mercury-2
# runs either side of that merge:
#
#   04:51 (no [openrouter] block)  13 log records, "AI response:" with valid
#                                  YAML, 2 suggestions posted
#   05:32 (both keys set)          11 records, stops at "PR diff:", no
#                                  response at all, failed in ~2 seconds
#
# effort is kept rather than max_tokens: it is the knob the model interprets
# for itself, and OpenRouter converts it to a budget for models that want one.
# A hard token budget would need re-tuning per model; "low" survives a swap.
reasoning_effort = "low"
