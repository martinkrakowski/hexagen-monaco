apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexagen-web
  labels:
    app: hexagen-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hexagen-web
  template:
    metadata:
      labels:
        app: hexagen-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: IMAGE_NAME
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hexagen-web
spec:
  selector:
    app: hexagen-web
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
