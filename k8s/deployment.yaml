apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexagen-web
  labels:
    app: hexagen-web
    tier: frontend
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hexagen-web
  template:
    metadata:
      labels:
        app: hexagen-web
        tier: frontend
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: web
          image: ${FULL_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: QUOTA_DB_PATH
              value: "/data/quota.db"
            - name: BYOK_DB_PATH
              value: "/data/byok.db"
          volumeMounts:
            - name: quota-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: quota-data
          persistentVolumeClaim:
            claimName: hexagen-monaco-quota-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hexagen-monaco-quota-data
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hexagen-web
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: hexagen-web
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
