project:
  name: example-studio
  description: Hexagonal human-in-the-loop orchestrator for enterprise content generation and policy compliance.
  version: "0.1.0"
  architectural_pattern: "ports_and_adapters"

# Trimmed from a larger import. `methods:` lists are omitted here:
# they aren't read by the dialect normalizer (only port names are), and their
# unquoted signatures contain colons that js-yaml can't parse as bare scalars.
bounded_contexts:
  - name: ContentOrchestration
    description: >
      The core driving context that manages the full lifecycle of a content brief
      through generation, rendering, compliance, and export.
    ports:
      primary:
        - name: ContentPipelinePort
          description: The single entry-point contract invoked by the API route.
      secondary_references:
        - ImageGeneratorPort
        - CanvasPort
        - CompliancePort
        - ExportPort

    domain_models:
      entities:
        - name: ContentBrief
          attributes:
            id: string
            targetRegion: string
            briefMessage: string
            products: Product[]
        - name: Product
          attributes:
            id: string
            name: string
            primaryColor: string
        - name: GeneratedAsset
          attributes:
            productId: string
            aspectRatio: AspectRatio
            complianceScore: number
            passedCompliance: boolean

      value_objects:
        - name: AspectRatio
          type: enum
          values: ["1:1", "9:16", "16:9"]
        - name: ComplianceResult
          attributes:
            passed: boolean
        - name: PipelineExecutionLog
          attributes:
            contentId: string
            totalOperations: number
        - name: LogEntry
          attributes:
            timestamp: Date
            stage: string
        - name: PipelineResult
          attributes:
            assets: GeneratedAsset[]

    domain_logic:
      rules:
        - name: MinimumProductsRule
          description: A ContentBrief must contain at least two unique products.
        - name: LocalizedMessageFallback
          description: Fall back to briefMessage when localizedMessage is null.

    primary_use_cases:
      - name: GenerateContentUseCase
        implements: ContentPipelinePort
        input: ContentBrief
        output: PipelineResult

    domain_events:
      - name: ContentBriefIngested
        payload:
          contentId: string
      - name: AssetRendered
        payload:
          productId: string
          operationIndex: number
      - name: PipelineHalted
        payload:
          contentId: string
          reason: string

  - name: AssetGeneration
    description: Driven context for background resolution and asset rendering.
    ports:
      driven:
        - name: ImageGeneratorPort
        - name: CanvasPort

  - name: GovernanceAndCompliance
    description: Automated circuit breaker for policy and style adherence.
    ports:
      driven:
        - name: CompliancePort

  - name: Distribution
    description: File persistence and print proof generation.
    ports:
      driven:
        - name: ExportPort
