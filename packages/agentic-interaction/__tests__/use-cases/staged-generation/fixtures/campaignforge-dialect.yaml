project:
  name: CampaignForge
  description: Hexagonal HITL Orchestrator for enterprise creative generation and brand compliance.
  version: "0.1.0"
  architectural_pattern: "ports_and_adapters"

# Trimmed from the real CampaignForge import. `methods:` lists are omitted here:
# they aren't read by the dialect normalizer (only port names are), and their
# unquoted signatures contain colons that js-yaml can't parse as bare scalars.
bounded_contexts:
  - name: CampaignOrchestration
    description: >
      The core driving context that manages the full lifecycle of a campaign brief
      through generation, compositing, compliance, and export.
    ports:
      primary:
        - name: CampaignPipelinePort
          description: The single entry-point contract invoked by the API route.
      secondary_references:
        - ImageGeneratorPort
        - CompositorPort
        - CompliancePort
        - ExportPort

    domain_models:
      entities:
        - name: CampaignBrief
          attributes:
            id: string
            targetRegion: string
            campaignMessage: string
            products: Product[]
        - name: Product
          attributes:
            id: string
            name: string
            primaryColor: string
        - name: GeneratedAsset
          attributes:
            productId: string
            aspectRatio: AspectRatio
            complianceScore: number
            passedCompliance: boolean

      value_objects:
        - name: AspectRatio
          type: enum
          values: ["1:1", "9:16", "16:9"]
        - name: ComplianceResult
          attributes:
            passed: boolean
        - name: PipelineExecutionLog
          attributes:
            campaignId: string
            totalOperations: number
        - name: LogEntry
          attributes:
            timestamp: Date
            stage: string
        - name: PipelineResult
          attributes:
            assets: GeneratedAsset[]

    domain_logic:
      rules:
        - name: MinimumProductsRule
          description: A CampaignBrief must contain at least two unique products.
        - name: LocalizedMessageFallback
          description: Fall back to campaignMessage when localizedMessage is null.

    primary_use_cases:
      - name: GenerateCampaignUseCase
        implements: CampaignPipelinePort
        input: CampaignBrief
        output: PipelineResult

    domain_events:
      - name: CampaignBriefIngested
        payload:
          campaignId: string
      - name: AssetComposited
        payload:
          productId: string
          operationIndex: number
      - name: PipelineHalted
        payload:
          campaignId: string
          reason: string

  - name: CreativeGeneration
    description: Driven context for background resolution and canvas compositing.
    ports:
      driven:
        - name: ImageGeneratorPort
        - name: CompositorPort

  - name: GovernanceAndCompliance
    description: Automated circuit breaker for legal copy and brand adherence.
    ports:
      driven:
        - name: CompliancePort

  - name: Distribution
    description: File persistence and print proof generation.
    ports:
      driven:
        - name: ExportPort
