project: krakowski-portal
apps:
  - name: portal-web
    deployment: vercel
  - name: portal-worker
    deployment: fly.io
    responsibilities:
      - email-retry
      - overdue-invoice-detection
      - stripe-reconciliation
bounded_contexts:
  - name: IdentityAccess
    type: core
    responsibility: User identity and access management
    aggregates:
      - name: User
        root: true
        fields:
          - name: id
            key: true
          - name: username
            key: false
      - name: OnboardingState
        root: false
        parent: Customer
    value_objects: []
    events_published: []
  - name: CustomerOnboarding
    type: core
    responsibility: Customer onboarding process
    aggregates:
      - name: Customer
        root: true
        fields:
          - name: id
            key: true
    value_objects: []
    events_published: []
  - name: InvoicingBilling
    type: core
    responsibility: Invoicing and billing management
    aggregates:
      - name: Invoice
        root: true
        fields:
          - name: id
            key: true
    value_objects:
      - name: Money
        rules:
          - Non-negative
    events_published:
      - InvoicePaid
  - name: PaymentProcessing
    type: core
    responsibility: Payment processing via Stripe
    aggregates:
      - name: Payment
        root: true
        fields:
          - name: id
            key: true
    value_objects: []
    events_published:
      - PaymentReceived
  - name: NotificationDelivery
    type: supporting
    responsibility: Notification delivery via email and in-app
    aggregates: []
    value_objects: []
    events_published: []
  - name: ProjectDelivery
    type: core
    responsibility: Project lifecycle management
    aggregates:
      - name: Project
        root: true
        fields:
          - name: id
            key: true
    value_objects: []
    events_published: []
  - name: ReportingAnalytics
    type: generic
    responsibility: Reporting and analytics
    aggregates: []
    value_objects: []
    events_published: []
  - name: DocumentVault
    responsibility: Contracts, shared files, scoped Supabase Storage
    aggregates: []
    value_objects: []
    events_published: []
use_cases:
  IdentityAccess:
    - name: RegisterUser
      actor: system
context_mappings:
  - upstream: Stripe
    downstream: PaymentProcessing
    pattern: OHS_ACL
    mechanism: webhook
  - upstream: PaymentProcessing
    downstream: InvoicingBilling
    pattern: OH
    mechanism: event
  - upstream: InvoicingBilling
    downstream: NotificationDelivery
    pattern: ACL
    mechanism: event
  - upstream: CustomerOnboarding
    downstream: IdentityAccess
    pattern: OH
    mechanism: api
  - upstream: IdentityAccess
    downstream: CustomerOnboarding
    pattern: OH
    mechanism: api
  - upstream: ProjectDelivery
    downstream: NotificationDelivery
    pattern: ACL
    mechanism: event
  - upstream: InvoicingBilling
    downstream: ProjectDelivery
    pattern: ACL
    mechanism: event
  - upstream: NotificationDelivery
    downstream: IdentityAccess
    pattern: OH
    mechanism: api
  - upstream: ReportingAnalytics
    downstream: ProjectDelivery
    pattern: OH
    mechanism: api
  - upstream: CustomerOnboarding
    downstream: InvoicingBilling
    pattern: OH
    mechanism: event
  - upstream: PaymentProcessing
    downstream: NotificationDelivery
    pattern: ACL
    mechanism: event
  - upstream: IdentityAccess
    downstream: InvoicingBilling
    pattern: OH
    mechanism: api
  - upstream: InvoicingBilling
    downstream: ReportingAnalytics
    pattern: OH
    mechanism: api
  - upstream: IdentityAccess
    downstream: ProjectDelivery
    pattern: OH
    mechanism: api
