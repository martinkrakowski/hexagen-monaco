name: Gate

# Generated by the hexagen orchestration template. This workflow runs ONE step:
# `hexagen-orchestration-gate`, which reads `.agents/orchestration/config.yaml`
# and runs the gate steps that file names, in order, stopping at the first
# failure by name. There is no second copy of the step list to keep in sync —
# `config.yaml` is the only place it appears.
#
# `--no-install` is deliberate: if the devDependency is missing, CI fails loudly
# rather than silently fetching an arbitrary version from the registry. For local
# convenience add a "gate": "hexagen-orchestration-gate" script to package.json
# by hand; this workflow does not use it, so CI and a human run the same bin.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow only checks out code and runs the gate, so the token it
# receives needs no write scope.
permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Corepack MUST run before setup-node: setup-node@v5 probes the
      # package-manager cache with the runner's global Yarn (Classic 1.22),
      # which hard-errors on a packageManager-pinned yarn@4 project. Enabling
      # Corepack first makes `yarn` resolve to the pinned shim.
      - name: Enable Corepack
        run: corepack enable

      # Read the pinned version from package.json's `packageManager` at runtime
      # so CI can never drift from what the project declares (no baked version). A project
      # without the field fails here with a clear message instead of an empty corepack argument.
      - name: Prepare package manager
        run: |
          pm=$(node -p "require('./package.json').packageManager || ''")
          [ -n "$pm" ] || { echo "::error::package.json has no packageManager field; corepack cannot pin the package manager"; exit 1; }
          corepack prepare "$pm" --activate

      - uses: actions/setup-node@v5
        with:
          node-version: "{node_version}"
          # No `cache: yarn` — and the v5 auto-probe is disabled explicitly:
          # setup-node@v5 otherwise still runs the global Yarn Classic
          # (`yarn cache dir`) to locate the store, which fails on a
          # packageManager-pinned project. Committing yarn.lock does NOT make it
          # safe: the hazard is the probe, not the lockfile. There is no Turbo
          # cache here — it belongs to ci-github-actions' own workflow.
          package-manager-cache: false

      # `--immutable`, unlike ci-github-actions' first run: gate.yml is added
      # after `yarn add`, by which point the project has a lockfile to install
      # against. See the template README's checklist order.
      - name: Install dependencies
        run: "yarn install --immutable"

      - name: Run the gate
        run: npx --no-install hexagen-orchestration-gate
