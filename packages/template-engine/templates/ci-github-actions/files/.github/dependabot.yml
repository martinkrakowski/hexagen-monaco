version: 2
updates:
  # Keep GitHub Actions versions current — stale, unpinned actions are a real
  # supply-chain risk. Grouped so a sweep of action bumps is ONE PR, not one per
  # action (a fresh repo is "behind latest" on every action at first push).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # npm: batch NON-BREAKING bumps (minor + patch) into one PR per dependency
  # type, so a freshly published repo doesn't open a wave of PRs (every dep is
  # "behind latest" at once on first push — previously production deps were
  # ungrouped, so each one opened its own PR). MAJOR bumps are IGNORED for the
  # first release cycle (see the ignore block below) — a fresh repo is a major
  # behind on several deps at once, and each major opens its own PR.
  # To go quieter still, switch npm to security-only updates — see README.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    # First-release-cycle quiet mode: skip major version bumps entirely.
    # Delete this block once the project is stable enough to review majors
    # one at a time. Security advisories still open PRs regardless.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
