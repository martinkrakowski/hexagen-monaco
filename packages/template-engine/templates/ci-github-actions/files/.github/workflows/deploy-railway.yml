name: Deploy to Railway

# Production deploy on every merge to main. Railway natively runs background
# worker services alongside the web service — pair with the bullmq template's
# separate-worker mode by adding a second deploy step targeting that service.
#
# TODO: add in GitHub repo → Settings → Secrets and variables → Actions:
#   - RAILWAY_TOKEN    (secret)    Railway → Account → Tokens
#   - RAILWAY_SERVICE  (variable)  the service name to redeploy (optional)
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        # Pinned to a commit SHA (not @main) so an upstream change can't alter
        # the deploy step; Dependabot bumps it via the github-actions ecosystem.
        uses: bervProject/railway-deploy@4a1cfdb24551aee5c891e0bc716e8de963c4fbe6 # 0.2.0-beta
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ vars.RAILWAY_SERVICE }}
