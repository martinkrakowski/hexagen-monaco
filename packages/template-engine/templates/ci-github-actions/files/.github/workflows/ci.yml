name: CI

# Generated by the hexagen ci-github-actions template.
# Choices recorded at install time:
#   triggers:        {ci_triggers}
#   run tests:       {run_tests}
#   cache strategy:  {cache_strategy}
#   deploy target:   {deploy_target}
#   preview deploys: {preview_deploys}
#   docker image:    {docker_build}
#
# The `on:` block below covers every branch push + PRs to main. Narrow it to
# match your triggers — e.g. push-main-only -> `branches: [main]`, or drop the
# `push:` key entirely to run on pull_request only.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight CI run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: {node_version}
          cache: "{package_manager}"

      # npm projects: replace with `npm ci`.
      - name: Install dependencies
        run: {package_manager} install --immutable

      # Turbo caches task outputs keyed by input hash, so unchanged packages are
      # skipped on warm runs (cache_strategy = {cache_strategy}). Set TURBO_TOKEN
      # and TURBO_TEAM below for the cross-run remote cache.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # `check:env` is provided by the env-setup template. Delete this step if
      # you did not install it.
      - name: Validate env vars
        run: {package_manager} check:env
        env:
          NODE_ENV: test

      - name: Build
        run: {package_manager} build
        env:
          # TODO: add TURBO_TOKEN (secret) and TURBO_TEAM (variable) for the
          # remote Turbo cache. Safe to omit — the build just won't share cache.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Typecheck
        run: {package_manager} typecheck

      - name: Lint
        run: {package_manager} lint

      # run_tests = {run_tests}; delete this step to skip tests in CI.
      - name: Test
        run: {package_manager} test
        env:
          NODE_ENV: test
