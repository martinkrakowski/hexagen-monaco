name: Deploy to VPS

# Production deploy via SSH + pull/build/restart — manual-only
# (workflow_dispatch) until the VPS secrets are configured, so a freshly pushed
# repo shows zero failed Actions runs (F20). Minimal-infrastructure option for
# a plain VPS running pm2.
#
# TO ENABLE automatic deploys on merge to main:
#   1. Add in GitHub repo → Settings → Secrets and variables → Actions:
#      - VPS_HOST     (secret)  hostname or IP
#      - VPS_USER     (secret)  ssh user
#      - VPS_SSH_KEY  (secret)  private key with deploy access
#   2. Uncomment the push trigger below (keep workflow_dispatch — it gives you
#      a manual deploy button in the Actions tab).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/app
            git pull origin main
            yarn install --immutable
            yarn build
            pm2 restart app
