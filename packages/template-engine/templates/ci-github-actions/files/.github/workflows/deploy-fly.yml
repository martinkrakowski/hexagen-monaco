name: Deploy to Fly.io

# Production deploy — manual-only (workflow_dispatch) until Fly.io is
# configured, so a freshly pushed repo shows zero failed Actions runs (F20).
# Fly.io suits apps that need persistent connections / WebSockets. Deploy
# config lives in fly.toml.
#
# TO ENABLE automatic deploys on merge to main:
#   1. Add FLY_API_TOKEN in GitHub repo → Settings → Secrets and variables →
#      Actions  (create one with `fly tokens create deploy`).
#   2. Uncomment the push trigger below (keep workflow_dispatch — it gives you
#      a manual deploy button in the Actions tab).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned to a commit SHA (not @master); Dependabot bumps it via the
      # github-actions ecosystem.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
