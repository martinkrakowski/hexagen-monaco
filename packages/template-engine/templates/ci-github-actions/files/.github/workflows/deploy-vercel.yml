name: Deploy to Vercel

# Production deploy — manual-only (workflow_dispatch) until Vercel is
# configured, so a freshly pushed repo shows zero failed Actions runs (F20).
#
# TO ENABLE automatic deploys on merge to main:
#   1. Add these in GitHub repo → Settings → Secrets and variables → Actions:
#      - VERCEL_TOKEN       (secret)   vercel.com → Account Settings → Tokens
#      - VERCEL_ORG_ID      (secret)   from `vercel link` → .vercel/project.json
#      - VERCEL_PROJECT_ID  (secret)   from `vercel link` → .vercel/project.json
#   2. Uncomment the push trigger below (keep workflow_dispatch — it gives you
#      a manual deploy button in the Actions tab).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Corepack MUST run before setup-node: setup-node@v5 probes the
      # package-manager cache with the runner's global Yarn (Classic), which
      # hard-errors on a packageManager-pinned yarn@4 project. Corepack
      # activates the package manager pinned in package.json
      # (`packageManager`). Mirrors ci.yml. See SETUP.md.
      - name: Enable Corepack
        run: corepack enable

      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      - uses: actions/setup-node@v5
        with:
          node-version: "{node_version}"
          # No `cache: yarn` — and the v5 auto-probe is disabled explicitly:
          # setup-node@v5 otherwise still runs the global Yarn Classic to locate
          # the store, which fails on a packageManager-pinned project. To cache,
          # add a separate actions/cache step AFTER Corepack. Mirrors ci.yml.
          package-manager-cache: false

      - run: "yarn install --immutable"

      - name: Deploy to Vercel (prebuilt)
        run: |
          npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
