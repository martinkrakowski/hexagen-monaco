name: "Capstone — First-Run-Green"

# Proves a freshly generated project installs the @hexagen-monaco tooling and the
# installed CLI targets it correctly — hermetic for the tooling (packed tarballs),
# no real npm release required. See scripts/capstone/first-run-green.js.
#
# The generate-then-gate jobs extend the same chassis to WIZARD-SHAPED projects
# (fixtures built at runtime from scripted wizard answers via wizardToManifest —
# the vellum findings harness, plan §5.2). See scripts/capstone/generate-then-gate.js.
on:
  # Always run on main (safety net: catches anything merged regardless of paths).
  push:
    branches: [main]
  # On PRs, only run when something that can affect first-run-green changes:
  # the published tooling + everything tsup inlines into its bundle, the
  # generator/templates, and the harness/publish scripts.
  pull_request:
    branches: [main]
    paths:
      - "packages/sync/**"
      - "packages/shared/**"
      - "packages/project-configuration/**"
      - "packages/governance/**"
      - "packages/visualization/**"
      - "packages/template-engine/**"
      # wizard-orchestration + project-generation feed the generate-then-gate
      # fixtures (wizardToManifest → external SyncEngine → add-on merge).
      - "packages/wizard-orchestration/**"
      - "packages/project-generation/**"
      - "tools/arch-linter/**"
      - "scripts/capstone/**"
      - "scripts/prepare-publish-package.js"
      - ".github/workflows/capstone.yml"
  workflow_dispatch:

jobs:
  first-run-green:
    name: "Generate → install → verify"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Corepack must be enabled BEFORE setup-node: setup-node@v5's environment
      # probe runs `yarn` (e.g. `yarn cache dir`), and the repo pins yarn@4 via
      # packageManager — classic global yarn errors on that. Enabling Corepack
      # first makes `yarn` resolve to the pinned 4.12.0 shim during the probe.
      - name: "Enable Corepack"
        run: corepack enable

      - name: "Prepare Yarn"
        run: corepack prepare yarn@4.12.0 --activate

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: "22.7"

      - name: "Install Dependencies"
        run: yarn install --immutable

      - name: "Run capstone (first-run-green)"
        run: yarn capstone

  # Wizard-shaped fixture, small: 1 bounded context + 5 add-on templates
  # (F3/F19/F21 surface). Cheap enough to run on every PR the paths filter
  # selects, alongside first-run-green.
  generate-then-gate-minimal:
    name: "Generate → gate (minimal-addons)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Same ordering rationale as above: Corepack BEFORE setup-node so the
      # environment probe sees yarn@4, not classic global yarn.
      - name: "Enable Corepack"
        run: corepack enable

      - name: "Prepare Yarn"
        run: corepack prepare yarn@4.12.0 --activate

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: "22.7"
          # setup-node@v5 probes the package-manager cache even without
          # `cache:` — disable it outright (the F21 hazard this harness gates
          # in EMITTED workflows applies to our own workflow too).
          package-manager-cache: false

      # The fixture installs public registry deps (turbo, typescript, eslint,
      # vitest, …) into a fresh temp project on every run — keep Yarn's global
      # cache warm across runs to hold the job in the 8–15 min budget.
      - name: "Cache Yarn global cache"
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: capstone-gate-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            capstone-gate-yarn-${{ runner.os }}-

      - name: "Install actionlint"
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          sudo mv ./actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: "Install Dependencies"
        run: yarn install --immutable

      - name: "Run generate-then-gate (minimal-addons)"
        run: yarn capstone:gate --fixture=minimal-addons

  # Wizard-shaped fixture, large: 15 bounded contexts + shared, Next.js web +
  # Nitro api (F2/F8/F15 surface). Install+build across 18 workspaces is the
  # expensive end of the 8–15 min budget, so it runs on main pushes and
  # manual dispatch only — PRs get the minimal fixture (above) plus the full
  # unit-level coverage of the same emission defaults in packages/sync,
  # wizard-orchestration and template-engine suites.
  generate-then-gate-monolith:
    name: "Generate → gate (monolith-15)"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "Enable Corepack"
        run: corepack enable

      - name: "Prepare Yarn"
        run: corepack prepare yarn@4.12.0 --activate

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: "22.7"
          package-manager-cache: false

      - name: "Cache Yarn global cache"
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: capstone-gate-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            capstone-gate-yarn-${{ runner.os }}-

      - name: "Install actionlint"
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          sudo mv ./actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: "Install Dependencies"
        run: yarn install --immutable

      - name: "Run generate-then-gate (monolith-15)"
        run: yarn capstone:gate --fixture=monolith-15
