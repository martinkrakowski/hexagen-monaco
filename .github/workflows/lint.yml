name: "Lint & Boundaries"

# Plan item 2.3 / AUD-019: the "3-layer information state firewall" had no CI
# job at all. Nothing under .github/workflows/ invoked eslint, lint:arch, or
# scripts/validate-ui-boundary.sh — the sole `eslint` string in capstone.yml is
# a comment describing a fixture's dev-deps, not an invocation. Enforcement was
# the pre-commit lint-staged hook, which any `--no-verify` bypasses, and
# validate-ui-boundary.sh has claimed "Run in CI as part of the merge gate" in
# its own header since it was written (scripts/validate-ui-boundary.sh:10) — a
# role no workflow granted it. This workflow grants it.
#
# All three legs of item 2.3 run here:
#   Layer 2 — workspace eslint  → "Run ESLint (all workspaces)"
#   Layer 3 — structural checks → "Verify UI Boundary (firewall layer 3)"
#   Layer 1 — arch-lint ratchet → "Verify Architecture Lint Ratchet"
#
# Deliberately its own workflow rather than more steps on sync-integrity.yml:
# it can be made a required check on its own, it fails in parallel with the
# build/sync gate instead of behind two full builds, and it gives the ratchet
# leg an obvious home.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Read-only: this workflow lints and publishes nothing.
permissions:
  contents: read

# A superseded push doesn't need to finish linting.
concurrency:
  group: "lint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "ESLint + UI boundary"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Corepack must be enabled BEFORE setup-node: setup-node@v5's environment
      # probe runs `yarn` (e.g. `yarn cache dir`), and the repo pins yarn@4 via
      # packageManager — classic global yarn errors on that. Enabling Corepack
      # first makes `yarn` resolve to the pinned yarn@4 shim during the probe.
      - name: "Enable Corepack"
        run: corepack enable

      # No version literal: `corepack prepare --activate` with no spec reads
      # `packageManager` from the root package.json, so a Yarn bump is a
      # one-line change there and CI cannot drift from the declared pin.
      - name: "Prepare Yarn"
        run: corepack prepare --activate

      - name: "Setup Node.js"
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.7"

      - name: "Install Dependencies"
        run: yarn install --immutable

      # `turbo run lint` silently skips any workspace with no `lint` script —
      # a package can drop out of the firewall by deleting one line of JSON and
      # the job still reports success. This asserts the skip set is exactly the
      # documented one, so the hole is pinned instead of silent and a NEW
      # unlinted package fails the build.
      - name: "Verify Lint Coverage"
        run: node scripts/check-lint-coverage.mjs

      # Layer 2. Runs eslint in every workspace that has a lint script, via the
      # same `turbo lint` the root `lint` script uses. `dependsOn: ["^build"]`
      # in turbo.json means dependency builds run first; that is the graph's
      # requirement, not an extra step here.
      #
      # SCOPE NOTE — this gates ERRORS, not warnings. The generated per-package
      # flat configs downgrade no-explicit-any and no-unused-vars to "warn",
      # and eslint exits 0 on warnings, so those do not block. Ratcheting to
      # --max-warnings=0 is a policy change with a large existing backlog and
      # belongs in its own item; it is not silently assumed here.
      - name: "Run ESLint (all workspaces)"
        run: yarn turbo run lint --output-logs=full --log-order=stream

      # Layer 3. Structural checks that eslint cannot express: kernel-package
      # imports and semantic state tokens leaking into packages/ui, runtime
      # imports of @internal ACL types (ADR-0021) in apps/web, and cross-slice
      # imports between apps/web/features slices. Exits 1 on a violation and 2
      # if its own blocklist fails to parse — an unparsed rule set is never
      # reported as compliant.
      - name: "Verify UI Boundary (firewall layer 3)"
        run: bash scripts/validate-ui-boundary.sh

      # The arch-linter's entry point is `node dist/cli.js` (tools/arch-linter
      # package.json `bin`/`lint:arch`), and **/dist/ is gitignored — on a fresh
      # CI checkout that file does not exist, so an unbuilt `yarn lint:arch`
      # dies with MODULE_NOT_FOUND. That is exactly the AUD-010 shape: a gate
      # whose binary CI could never resolve. It is built explicitly here rather
      # than left to a side effect of another step, because arch-linter has no
      # `lint` script (it is in check-lint-coverage.mjs's UNLINTED set) and is a
      # dependency of no linted workspace, so `turbo run lint`'s `^build` never
      # reaches it.
      #
      # Not `--filter=@hexagen/arch-linter`: the linter resolves `@scope/pkg`
      # import targets through the workspace symlinks, whose `exports` point at
      # each package's dist/. An unbuilt package resolves to nothing, and the
      # resolution-dependent rules (domain-layer-import, application-layer-import)
      # then produce no finding for it — the ratchet would silently check less
      # than it claims. Building the whole graph makes the CI run see the same
      # sources the baseline was recorded against. Cost is near zero: the
      # eslint step above already builds most of this closure via `^build`, and
      # turbo serves it from cache.
      - name: "Build Packages (arch-linter bin + resolvable workspace targets)"
        run: yarn turbo run build --output-logs=errors-only --log-order=stream

      # Layer 1. The architecture ratchet (ADR-0054 §1). Fails on any boundary
      # violation NOT already recorded in .architecture/arch-lint-baseline.json;
      # the 34 accepted entries stay suppressed so `main` is not red-walled
      # while Waves 5-8 burn them down.
      #
      # The baseline path is passed explicitly even though it is also the CLI
      # default: this step then names the exact file it enforces against, and a
      # `--baseline` with no value is fatal in the CLI rather than a silent
      # fall back to the default. If the file is ever deleted or renamed the
      # linter enforces EVERYTHING and this step goes red — deleting the
      # baseline cannot buy an amnesty.
      #
      # NOT gated here: baseline GROWTH, and stale entries. A baselined
      # violation that no longer reproduces is warned about in this step's log
      # but exits 0 (see reportAndExit in tools/arch-linter/src/cli.ts) — the
      # file's monotone-decreasing property is review-enforced by ADR-0054 §1,
      # not machine-enforced. Read the "no longer reproduces" warnings and
      # delete those lines in the PR that fixed them.
      #
      # Overlaps sync-integrity.yml's "Verify Architecture (arch-linter,
      # strict)" deliberately. That step shells out to the linter through
      # `sync --strict` with no arguments, so it picks up the same baseline by
      # default — but only after two full builds and a sync, only through a bin
      # resolver that has its own "not installed" failure mode, and never
      # naming the baseline it enforces. This step invokes the linter directly,
      # names the file, and fails in parallel with that job.
      - name: "Verify Architecture Lint Ratchet"
        run: yarn lint:arch --baseline .architecture/arch-lint-baseline.json
