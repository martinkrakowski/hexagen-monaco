name: "Lint & Boundaries"

# Plan item 2.3 / AUD-019: the "3-layer information state firewall" had no CI
# job at all. Nothing under .github/workflows/ invoked eslint, lint:arch, or
# scripts/validate-ui-boundary.sh — the sole `eslint` string in capstone.yml is
# a comment describing a fixture's dev-deps, not an invocation. Enforcement was
# the pre-commit lint-staged hook, which any `--no-verify` bypasses, and
# validate-ui-boundary.sh has claimed "Run in CI as part of the merge gate" in
# its own header since it was written (scripts/validate-ui-boundary.sh:10) — a
# role no workflow granted it. This workflow grants it.
#
# All three legs of item 2.3 run here:
#   Layer 2 — workspace eslint  → "Run ESLint (all workspaces)"
#   Layer 3 — structural checks → "Verify UI Boundary (firewall layer 3)"
#   Layer 1 — arch-lint ratchet → "Verify Architecture Lint Ratchet"
#
# Deliberately its own workflow rather than more steps on sync-integrity.yml:
# it can be made a required check on its own, it fails in parallel with the
# build/sync gate instead of behind two full builds, and it gives the ratchet
# leg an obvious home.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# contents:read for checkout. pull-requests:write so the conformance
# action can comment only THIS PR's new violations (silent when clean).
permissions:
  contents: read
  pull-requests: write

# A superseded push doesn't need to finish linting.
concurrency:
  group: "lint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "ESLint + UI boundary"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs-only fast path. Neither ESLint, the UI-boundary script, nor the
      # arch-lint ratchet parses markdown -- all three read .ts/.tsx source,
      # .architecture/** YAML, and package.json. A changeset confined to
      # *.md is a no-op for every check this job runs, so every step below
      # is skipped when this is true. The JOB still runs and reports success
      # either way -- only individual steps are conditional -- so a required
      # branch-protection check never hangs waiting for a workflow that
      # never triggered (which is what a `paths-ignore` on the trigger would
      # do instead). fetch-depth: 0 above fetches full history for all
      # branches and tags, so both SHAs below are always resolvable when the
      # events provide them.
      #
      # Do NOT copy this rule to a workflow that runs `yarn test`: this repo
      # has real .md test fixtures (e.g.
      # packages/agentic-interaction/__tests__/**/fixtures/*.md) that a test
      # suite reads as literal input, so a blanket *.md skip would be wrong
      # there. It is safe here only because this job never runs tests.
      # shell: bash pinned explicitly, not left to the runner default --
      # this step uses process substitution (`< <(...)`) and `read -d`,
      # neither of which POSIX sh (e.g. dash) supports. GitHub Actions
      # defaults Linux/macOS `run:` steps to bash already, but the local
      # pre-commit hook (.husky/pre-commit) hit exactly this class of
      # mistake -- husky invokes it via `sh -e` regardless of its shebang --
      # so this is pinned rather than assumed a second time.
      - name: "Detect docs-only changeset"
        id: docs-only
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            diff_range="${base}...${head}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            diff_range="${base} ${head}"
          fi

          # A force-push, a new branch's first push (before = all-zeros), or
          # any SHA this checkout can't resolve falls back to the full
          # pipeline -- never skip on a diff that couldn't actually be computed.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Base SHA unusable ('$base') -- running the full pipeline."
            exit 0
          fi

          # --no-renames is load-bearing, not cosmetic: `--name-only` on a
          # detected rename prints only the destination path, so a rename
          # from foo.ts to notes.md would show as a single "notes.md" line
          # and be misclassified as docs-only -- silently skipping the
          # typecheck that would have caught every other file's now-broken
          # import of foo.ts. --no-renames forces both sides of the rename
          # to appear as a plain delete + add, and foo.ts disqualifies the
          # fast path correctly. -z + a NUL-delimited read loop is the same
          # pattern tools/arch-linter/src/git-ops.ts's stagedFiles() already
          # uses, for the same reason: `--name-only` on its own is
          # newline-delimited and mis-parses a path containing an embedded
          # newline.
          is_docs_only=true
          file_count=0
          while IFS= read -r -d '' f; do
            if [ -n "$f" ]; then
              file_count=$((file_count + 1))
              case "$f" in
                *.md) ;;
                *) is_docs_only=false ;;
              esac
            fi
          done < <(git diff --name-only -z --no-renames $diff_range || echo -ne "")

          if [ "$file_count" -eq 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$is_docs_only" = "false" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only changeset (${file_count} file(s), all *.md) -- skipping lint/build/ratchet."
          fi

      # Corepack must be enabled BEFORE setup-node: setup-node@v5's environment
      # probe runs `yarn` (e.g. `yarn cache dir`), and the repo pins yarn@4 via
      # packageManager — classic global yarn errors on that. Enabling Corepack
      # first makes `yarn` resolve to the pinned yarn@4 shim during the probe.
      - name: "Enable Corepack"
        if: steps.docs-only.outputs.docs_only != 'true'
        run: corepack enable

      # No version literal: `corepack prepare --activate` with no spec reads
      # `packageManager` from the root package.json, so a Yarn bump is a
      # one-line change there and CI cannot drift from the declared pin.
      - name: "Prepare Yarn"
        if: steps.docs-only.outputs.docs_only != 'true'
        run: corepack prepare --activate

      - name: "Setup Node.js"
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.7"

      # Yarn 4 default httpTimeout is 60s. Public-PR hardened mode makes
      # resolution slower; a single TLS socket stall (YN0001 RequestError)
      # fails the whole job. Timeout + retries, not a lockfile change.
      - name: "Install Dependencies"
        if: steps.docs-only.outputs.docs_only != 'true'
        env:
          YARN_HTTP_TIMEOUT: "120000"
        run: |
          for attempt in 1 2 3; do
            yarn install --immutable && exit 0
            echo "yarn install failed (attempt ${attempt}/3)"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      # `turbo run lint` silently skips any workspace with no `lint` script —
      # a package can drop out of the firewall by deleting one line of JSON and
      # the job still reports success. This asserts the skip set is exactly the
      # documented one, so the hole is pinned instead of silent and a NEW
      # unlinted package fails the build.
      - name: "Verify Lint Coverage"
        if: steps.docs-only.outputs.docs_only != 'true'
        run: node scripts/check-lint-coverage.mjs

      # Layer 0. Formatting was enforced ONLY by lint-staged (pre-commit), so
      # anything committed with --no-verify, produced in a worktree without
      # node_modules, or merged from a branch that never ran the hook drifted
      # silently. 42 files had accumulated by the time anyone looked.
      #
      # This is the structural fix: the hook cannot see what bypasses it, and
      # in a delegated workflow bypassing it is the normal case, not the
      # exception -- a worker with no node_modules cannot run prettier at all.
      #
      # --check, never --write: CI reports drift, it does not rewrite the
      # author's commit behind their back. `yarn format` is the fix.
      # Deliberately NOT gated on docs-only. This check covers *.md, so a
      # docs-only PR is exactly the case where markdown drift lands -- guarding
      # it behind that condition would skip the gate precisely when it is the
      # only gate that applies. Prettier over the repo takes a few seconds.
      #
      # But on the docs-only path node_modules is ABSENT, and a bare
      # `npx prettier` then downloads the newest release rather than the locked
      # one. On 2026-08-23 that judged the tree with 3.9.6 while the lockfile
      # pinned 3.8.1 and flagged 85 files no PR had touched. Both paths below
      # therefore run the lockfile's version: `--no-install` makes the installed
      # path fail loudly if prettier is missing instead of fetching, and the
      # docs-only path reads the resolved version out of yarn.lock.
      - name: "Verify Formatting"
        env:
          DOCS_ONLY: ${{ steps.docs-only.outputs.docs_only }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            # Resolve the ROOT selector to its lockfile block, not "the first
            # prettier block": a second prettier@npm:<range> entry from any
            # workspace or plugin would otherwise win silently. Yarn 4 lockfile
            # keys can carry several selectors ("a@npm:^1, a@npm:^1.2":), so
            # the key is split and each selector compared whole.
            selector="prettier@npm:$(node -p "require('./package.json').devDependencies.prettier")"
            locked=$(awk -v key="$selector" '
              /^"/ {
                block = 0
                line = $0
                sub(/^"/, "", line)
                sub(/":$/, "", line)
                n = split(line, selectors, ", ")
                for (i = 1; i <= n; i++) if (selectors[i] == key) block = 1
              }
              block && /version:/ { print $2; exit }
            ' yarn.lock)
            if [ -z "$locked" ]; then
              echo "::error::no yarn.lock block matches the root selector ${selector}"
              exit 1
            fi
            echo "docs-only fast path: running locked prettier@${locked}"
            npx --yes "prettier@${locked}" --check "**/*.{ts,tsx,md,json}"
          else
            npx --no-install prettier --check "**/*.{ts,tsx,md,json}"
          fi

      # Layer 2. Runs eslint in every workspace that has a lint script, via the
      # same `turbo lint` the root `lint` script uses. `dependsOn: ["^build"]`
      # in turbo.json means dependency builds run first; that is the graph's
      # requirement, not an extra step here.
      #
      # SCOPE NOTE — this gates ERRORS, not warnings. The generated per-package
      # flat configs downgrade no-explicit-any and no-unused-vars to "warn",
      # and eslint exits 0 on warnings, so those do not block. Ratcheting to
      # --max-warnings=0 is a policy change with a large existing backlog and
      # belongs in its own item; it is not silently assumed here.
      - name: "Run ESLint (all workspaces)"
        if: steps.docs-only.outputs.docs_only != 'true'
        run: yarn turbo run lint --output-logs=full --log-order=stream

      # Layer 3. Structural checks that eslint cannot express: kernel-package
      # imports and semantic state tokens leaking into packages/ui, runtime
      # imports of @internal ACL types (ADR-0021) in apps/web, and cross-slice
      # imports between apps/web/features slices. Exits 1 on a violation and 2
      # if its own blocklist fails to parse — an unparsed rule set is never
      # reported as compliant.
      - name: "Verify UI Boundary (firewall layer 3)"
        if: steps.docs-only.outputs.docs_only != 'true'
        run: bash scripts/validate-ui-boundary.sh

      # The arch-linter's real entry point is `dist/cli.js` (tools/arch-linter
      # package.json `bin`), and **/dist/ is gitignored — on a fresh CI checkout
      # that file does not exist. That is the AUD-010 shape: a gate whose binary
      # CI could never resolve. It is built explicitly here rather than left to a
      # side effect of another step, because arch-linter has no `lint` script (it
      # is in check-lint-coverage.mjs's UNLINTED set) and is a dependency of no
      # linted workspace, so `turbo run lint`'s `^build` never reaches it.
      #
      # If this step is ever reordered, dropped, or silently fails, the ratchet
      # step below no longer goes green over nothing: `lint:arch` now runs
      # through `tools/arch-linter/bin/lint-arch.mjs`, which refuses to start
      # without its build output and exits **2** ("could not run — NOTHING WAS
      # CHECKED"), distinct from 0 (compliant) and 1 (violations found). This
      # step is still the fix; the launcher is the alarm that says so out loud
      # instead of a raw MODULE_NOT_FOUND stack trace.
      #
      # Building the arch-linter ALONE is not enough either. The linter resolves
      # `@scope/pkg` import targets through ts-morph — i.e. through the workspace
      # symlinks, whose `exports` point at each package's dist/. An unbuilt
      # package resolves to nothing, and the resolution-dependent rules
      # (domain-layer-import, application-layer-import) then produce no finding
      # for it: the ratchet would silently check less than it claims. So every
      # package the linter can resolve has to be built.
      #
      # The filter is therefore a SUBTRACTION, not a selection. `!web` builds
      # every workspace except the Next app. A selection (`--filter=@hexagen/*`)
      # would be the form that degrades quietly: a workspace added outside that
      # scope drops out of the build, and out of the ratchet's resolution with
      # it, with no signal. Subtracting over-builds instead — anything added
      # later is built by default, and the failure direction is "built more than
      # strictly needed", never "checked less than claimed".
      #
      # `web` is safe to subtract for a structural reason, not a timing one. The
      # linter walks `<workspacesDir>/<name>` (i.e. packages/) for each entry in
      # the manifest's `bounded_contexts`; `web` is under `apps:`, so its sources
      # are never scanned. It is also a private Next app: it exports nothing, and
      # no workspace depends on it, so its build output is never an import target
      # either. Verified on this branch — the full violation output after
      # `--filter='!web'` and after an unfiltered build is byte-identical (34
      # findings each, `diff` clean).
      #
      # What the subtraction removes is `next build --webpack`: the dominant
      # cost of this step, and a path by which an unrelated app-build breakage
      # fails the LINT gate. sync-integrity.yml already builds the app, so that
      # breakage is still caught — just not here, where it says nothing about
      # lint or architecture. This step is still not free (turbo has no remote
      # cache here and the eslint step's `^build` closure does not come back as
      # hits on a hosted runner, so it builds 38 packages from scratch); it is
      # merely no longer paying for a build the ratchet cannot use.
      - name: "Build Packages (arch-linter bin + resolvable workspace targets)"
        if: steps.docs-only.outputs.docs_only != 'true'
        run: yarn turbo run build --filter='!web' --output-logs=errors-only --log-order=stream

      # Layer 1. The architecture ratchet (ADR-0054 §1). Fails on any boundary
      # violation NOT already recorded in .architecture/arch-lint-baseline.json;
      # the 4 accepted entries stay suppressed so `main` is not red-walled
      # while remaining debt is burnt down.
      #
      # The baseline path is passed explicitly even though it is also the CLI
      # default: this step then names the exact file it enforces against, and a
      # `--baseline` with no value is fatal in the CLI rather than a silent
      # fall back to the default. If the file is ever deleted or renamed the
      # linter enforces EVERYTHING and this step goes red — deleting the
      # baseline cannot buy an amnesty.
      #
      # Baseline GROWTH is machine-enforced on pull_request. Do NOT put
      # `--pr-diff` in lint-command: hexagen-conformance appends
      # `--pr-diff --base-ref origin/<base>` only when the event is
      # pull_request. Hardcoding --pr-diff here FATALS on push to main
      # (no GITHUB_BASE_REF). Stale entries still warn and exit 0.
      #
      # Overlaps sync-integrity.yml's "Verify Architecture (arch-linter,
      # strict)" deliberately. That step shells out to the linter through
      # `sync --strict` with no arguments, so it picks up the same baseline by
      # default — but only after two full builds and a sync, only through a bin
      # resolver that has its own "not installed" failure mode, and never
      # naming the baseline it enforces. This step invokes the linter directly,
      # names the file, and fails in parallel with that job.
      # MUST run after "Build Packages" above. The script shells out to
      # `npx eslint` directly rather than through turbo, so turbo's
      # `lint: dependsOn ["^build"]` does not apply and the plugin's dist/ is
      # not built for it. Placed earlier, it failed with ERR_MODULE_NOT_FOUND
      # on @hexagen/eslint-plugin-ui/dist/index.js -- a real CI failure on
      # #617, not a hypothetical.
      - name: "Spacing debt (shrink-only)"
        if: steps.docs-only.outputs.docs_only != 'true'
        run: node scripts/check-spacing-debt.mjs

      - name: "Verify Architecture Lint Ratchet"
        if: steps.docs-only.outputs.docs_only != 'true'
        uses: ./.github/actions/hexagen-conformance
        with:
          lint-command: yarn lint:arch -- --baseline .architecture/arch-lint-baseline.json --ratchet
          skip-sync-check: "true"

  # ---------------------------------------------------------------------------
  # Standalone packaging smoke test.
  #
  # Every gate above reads SOURCE. None of them can see what Next's file tracer
  # actually copied into .next/standalone, and that gap has now shipped three
  # production defects that were individually invisible to tests, typecheck and
  # lint:
  #
  #   1. the hexagen CLIs were absent from the image entirely (fixed in #615)
  #   2. hexagen-lint was traced to tools/arch-linter, a path the resolver never
  #      consults, because the tracer copies FILES and not Yarn's workspace
  #      symlinks
  #   3. the scan routes anchored on .architecture/manifest.yaml, which the
  #      standalone tree does not contain at all, so every scan threw before it
  #      looked for a binary
  #
  # Unit tests could not catch any of them: they inject the root
  # (`new CliHexagenScanAdapter(ROOT, ...)`) or mock the factory outright
  # (`fromMonorepoRoot: () => ({ scanZip })`), so the one line that fails in
  # production never executes. monorepo-root.test.ts writes its own fixture
  # manifest, so it proves the WALK works and can never notice a missing tree.
  # The only job that builds an image is deploy.yml, which is
  # workflow_dispatch-only and ships rather than validates.
  #
  # So this job asserts the packaged artifact, not the source: build standalone,
  # then run a real scan out of it and require collected findings. It fails on
  # the artifact being wrong, which is the only place these defects are visible.
  standalone-smoke:
    name: "Standalone packaging smoke test"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: "Setup Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Matches apps/web/Dockerfile's node:20-alpine (lines 2 and 54).
          #
          # This job exists to run the packaged artifact rather than read the
          # source, so it has to run it on the version the image runs it on. A
          # traced dependency that loads on 22 and fails on 20 would pass here
          # and fail in production -- the same blind spot the job comment above
          # describes, reintroduced by the job meant to close it.
          node-version: "20"

      - name: "Enable Corepack"
        run: corepack enable

      # No version literal, matching the lint job above: `corepack prepare
      # --activate` with no spec reads `packageManager` from the root
      # package.json, so CI cannot drift from the declared Yarn pin. Without
      # this the job installs with whatever Yarn corepack defaults to.
      - name: "Prepare Yarn"
        run: corepack prepare --activate

      - name: "Install Dependencies"
        run: yarn install --immutable

      - name: "Build web (standalone output)"
        run: yarn turbo build --filter=web --concurrency=1

      - name: "Assert the packaged artifact can actually scan"
        run: node scripts/verify-standalone-scan.mjs
