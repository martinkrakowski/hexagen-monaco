name: "Architectural Integrity Check"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify-sync:
    name: "Verify Sync Engine & Hexagonal Structure"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for the engine's Git checks

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: "Install Dependencies"
        run: yarn install --frozen-lockfile

      - name: "Build Sync Engine"
        run: yarn turbo run build --filter=@hexagen/sync

      - name: "Execute Hardened Sync"
        # We use --force and --allow-dirty here for CI environment
        # The sync engine verifies architectural rules are not violated.
        run: yarn sync --force --allow-dirty

      - name: "Verify Build After Sync"
        run: yarn build

      - name: "Verify TypeCheck After Sync"
        run: yarn typecheck

      - name: "Verify Architectural Rules After Sync"
        run: yarn sync:dry
