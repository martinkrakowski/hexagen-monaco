name: "Architectural Integrity Check"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-sync:
    name: "Verify Sync Engine & Hexagonal Structure"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for the engine's Git checks

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: "Enable Corepack"
        run: corepack enable

      - name: "Prepare Yarn"
        run: corepack prepare yarn@4.12.0 --activate

      - name: "Install Dependencies"
        run: yarn install --immutable

      - name: "Build All Packages"
        # Build everything first so turbo CLI and all dependencies are available
        run: yarn build --verbose 2>&1 || (echo "::error::Build failed. See logs above for details." && exit 1)

      - name: "Execute Hardened Sync"
        # We use --force and --allow-dirty here for CI environment
        # The sync engine verifies architectural rules are not violated.
        run: yarn sync --force --allow-dirty

      - name: "Verify Build After Sync"
        run: yarn build

      - name: "Verify TypeCheck After Sync"
        run: yarn typecheck

      - name: "Verify Architectural Rules After Sync"
        run: yarn sync:dry
