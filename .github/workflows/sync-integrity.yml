name: "Build & Sync Integrity Check"
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Both jobs only read the repo (checkout with persist-credentials: false) and
# publish nothing — pin the GITHUB_TOKEN to read-only instead of inheriting
# the repository default (same pattern as lint.yml / capstone.yml).
permissions:
  contents: read

jobs:
  verify-sync:
    name: "Verify Sync Engine & Hexagonal Structure"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for the engine's Git checks
          persist-credentials: false

      # Corepack must be enabled BEFORE setup-node: setup-node@v5's environment
      # probe runs `yarn` (e.g. `yarn cache dir`), and the repo pins yarn@4 via
      # packageManager — classic global yarn errors on that. Enabling Corepack
      # first makes `yarn` resolve to the pinned yarn@4 shim during the probe.
      - name: "Enable Corepack"
        run: corepack enable

      # No version literal: `corepack prepare --activate` with no spec reads
      # `packageManager` from the root package.json, so a Yarn bump is a
      # one-line change there and CI cannot drift from the declared pin.
      - name: "Prepare Yarn"
        run: corepack prepare --activate

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: "22.7"

      # Yarn 4 default httpTimeout is 60s. Public-PR hardened mode makes
      # resolution slower; a single TLS socket stall (YN0001 RequestError)
      # fails the whole job. Timeout + retries, not a lockfile change.
      - name: "Install Dependencies"
        env:
          YARN_HTTP_TIMEOUT: "120000"
        run: |
          for attempt in 1 2 3; do
            yarn install --immutable && exit 0
            echo "yarn install failed (attempt ${attempt}/3)"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: "Verify Dependency Constraints"
        # Enforces yarn.config.cjs: the PINNED single-range policy, plus the
        # stale-entry guard over KNOWN_SPLITS. It is deliberately NOT "one range
        # for every shared dependency" — KNOWN_SPLITS documents the major-version
        # splits that are allowed to differ pending a decision.
        # Without this step the constraint file is documentation, not a gate —
        # range drift would reappear and only be caught if someone happened to
        # run `yarn constraints` by hand. Runs right after install because it
        # reads manifests only; no build required.
        run: yarn constraints

      - name: "Build All Packages"
        run: yarn turbo run build --output-logs=full --log-order=stream

      - name: "Execute Hardened Sync"
        run: yarn workspace @hexagen/sync run cli sync --force --allow-dirty

      - name: "Verify Build After Sync"
        run: yarn turbo run build --output-logs=full --log-order=stream --force

      - name: "Verify TypeCheck After Sync"
        run: yarn turbo run typecheck --output-logs=full --log-order=stream

      - name: "Verify TypeCheck (test sources)"
        # `typecheck` only covers each package's `src` — its tsconfig excludes
        # __tests__. Test files were therefore never type-checked by CI at all,
        # so mocks and fixtures silently drifted away from the ports and value
        # objects they stand in for (AUD-020). This step runs the per-package
        # `typecheck:test` script (tsconfig.test.json, which includes
        # __tests__/**) and fails the job on any test-source type error.
        # Placed immediately after the src typecheck so the two type gates sit
        # together, and BEFORE the test suite: a type error in a fixture should
        # be reported as a type error, not as a downstream runtime failure.
        # `--continue` so one package's errors do not hide the rest.
        run: yarn turbo run typecheck:test --continue --output-logs=full --log-order=stream

      - name: "Verify Architecture (arch-linter, strict)"
        # A REAL architecture gate. The previous `sync --dry-run` was toothless:
        # under --dry-run the sync engine short-circuits the linter entirely
        # ("[DRY-RUN] would run arch-linter"), so a boundary violation could
        # never fail this step (AUD-010). `--strict` runs the linter for real
        # and aborts on a violation — or on a timeout, which is treated as
        # "could not verify", never a silent pass. The sync itself is a no-op
        # here (the tree was already converged by "Execute Hardened Sync").
        run: yarn workspace @hexagen/sync run cli sync --strict --allow-dirty

      - name: "Verify Template Questions Generator Parity"
        # Asserts the two generated wizard modules are in sync with the manifests
        # under packages/template-engine/templates:
        #   - features/project-wizard/steps/template-questions-step/template-questions.generated.ts
        #     (id -> questions)
        #   - lib/generated/template-manifest.generated.ts (id -> name/description/
        #     requires/conflicts, which the add-ons catalog merges with curated
        #     presentation fields; hexagon-canvas reads it too, so it is
        #     slice-neutral rather than owned by the wizard step)
        # If a manifest was edited without re-running
        # `yarn workspace web gen:template-questions`, this step fails with
        # instructions. It also hard-fails on a `requires` naming a non-existent
        # template.
        run: yarn workspace web check:template-questions

      - name: "Run Test Suite"
        run: yarn turbo run test --output-logs=full --log-order=stream

  # Windows leg — enforcement plan P3.1, scope decided by D-1 (accepted
  # 2026-08-23): packages/sync + tools/arch-linter ONLY. Every catalogue §2.3
  # path defect (#466 ts-morph separators, #458 fast-glob backslash, #545
  # `..\..\` containment escape) lived in these two packages; apps/web would
  # add better-sqlite3's native Windows build for no known defect. The turbo
  # filter pulls only the two packages' tests plus builds of their five
  # workspace deps (governance, project-configuration, shared,
  # template-engine, visualization) — verified via --dry-run; `web` is not in
  # scope, so better-sqlite3 never builds here.
  #
  # NOT a required check yet: D-6 makes it required only after it is green
  # and its wall-clock is recorded in the PR body (revisit D-1 with that
  # number). This workflow has no `concurrency:` group, so this job cannot
  # cancel the ubuntu leg (#610's failure mode does not apply).
  #
  # Known skips on win32: 12 suites guard with `{ skip: SKIP_NON_POSIX }`
  # (6 in packages/sync — the published-layout contract suites — and 6
  # arch-linter CLI-layout suites), ~69 of 1026 tests. The leg's value is
  # the other ~957, which exercise path handling on a real `\` separator.
  verify-sync-windows:
    name: "Sync & Arch-Linter Tests (Windows)"
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the scope probe below diffs base...head
          persist-credentials: false

      # Only changes that can affect the published packages pay for this leg.
      # The job ALWAYS runs and always reports, so it stays eligible to be a
      # required check -- a `paths:` trigger filter would emit no check at all
      # on a non-matching PR, which blocks the merge rather than passing it.
      # Same shape as lint.yml's docs-only fast path.
      #
      # Fails OPEN: an unusable base SHA, or an empty diff, runs the tests.
      # Skipping on a broken probe would be a green check over an unexamined
      # change -- the exact pattern the arch-linter vacuity guard exists to
      # stop.
      - name: "Scope: does this change touch the published packages?"
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            diff_range="${base}...${head}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            diff_range="${base} ${head}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Base SHA unusable ('$base') -- running the leg."
            exit 0
          fi

          relevant=false
          file_count=0
          while IFS= read -r -d '' f; do
            if [ -n "$f" ]; then
              file_count=$((file_count + 1))
              case "$f" in
                packages/sync/* | tools/arch-linter/* | scripts/* | yarn.lock | package.json | turbo.json | tsconfig.base.json | .github/workflows/sync-integrity.yml)
                  relevant=true
                  ;;
              esac
            fi
          done < <(git diff --name-only -z --no-renames $diff_range || echo -ne "")

          if [ "$file_count" -eq 0 ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Empty diff -- running rather than passing over an unexamined change."
            exit 0
          fi

          if [ "$relevant" = "true" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Touches the published packages (${file_count} file(s) changed) -- running the leg."
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "No published-package files among ${file_count} changed file(s) -- skipping the Windows suites."
          fi

      # Same Corepack-before-setup-node ordering as the ubuntu job, and for
      # the same reason: setup-node's probe runs `yarn`, which must already
      # resolve to the pinned yarn@4 shim.
      #
      # But plain `corepack enable` is NOT enough on Windows: it writes the
      # shims next to the *current* node binary (the runner's default node
      # dir), which the runner's preinstalled Yarn 1 shim (C:\npm\prefix\
      # yarn.cmd) precedes on PATH — setup-node@v5's probe then resolved
      # yarn 1.22.22 and failed on the packageManager pin (run 32667225915).
      # Install the yarn shim into a dedicated dir prepended via GITHUB_PATH
      # so it wins PATH resolution for setup-node and every later step
      # (setup-node prepends its own node dir too, but that dir has no yarn,
      # so the shim still wins for `yarn`).
      - name: "Enable Corepack"
        if: steps.scope.outputs.run_tests == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-shims"
          corepack enable --install-directory "$RUNNER_TEMP/corepack-shims" yarn
          echo "$RUNNER_TEMP/corepack-shims" >> "$GITHUB_PATH"

      - name: "Prepare Yarn"
        if: steps.scope.outputs.run_tests == 'true'
        run: corepack prepare --activate

      - name: "Setup Node.js"
        if: steps.scope.outputs.run_tests == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22.7"

      # bash, not pwsh: reuses the ubuntu job's retry loop verbatim. The only
      # install-time lifecycle script in the graph is the root `prepare`
      # (husky), whose bin is Node — no shell script runs at install.
      - name: "Install Dependencies"
        if: steps.scope.outputs.run_tests == 'true'
        shell: bash
        env:
          YARN_HTTP_TIMEOUT: "120000"
        run: |
          for attempt in 1 2 3; do
            yarn install --immutable && exit 0
            echo "yarn install failed (attempt ${attempt}/3)"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: "Run Scoped Test Suites"
        if: steps.scope.outputs.run_tests == 'true'
        shell: bash
        run: yarn turbo run test --filter=@hexagen/sync --filter=@hexagen/arch-linter --output-logs=full --log-order=stream
