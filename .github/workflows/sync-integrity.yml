name: "Build & Sync Integrity Check"
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  verify-sync:
    name: "Verify Sync Engine & Hexagonal Structure"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for the engine's Git checks
          persist-credentials: false

      # Corepack must be enabled BEFORE setup-node: setup-node@v5's environment
      # probe runs `yarn` (e.g. `yarn cache dir`), and the repo pins yarn@4 via
      # packageManager — classic global yarn errors on that. Enabling Corepack
      # first makes `yarn` resolve to the pinned 4.12.0 shim during the probe.
      - name: "Enable Corepack"
        run: corepack enable

      - name: "Prepare Yarn"
        run: corepack prepare yarn@4.12.0 --activate

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: "22.7"

      - name: "Install Dependencies"
        run: yarn install --immutable

      - name: "Verify Dependency Constraints"
        # Enforces yarn.config.cjs: one declared range per shared dependency.
        # Without this step the constraint file is documentation, not a gate —
        # range drift would reappear and only be caught if someone happened to
        # run `yarn constraints` by hand. Runs right after install because it
        # reads manifests only; no build required.
        run: yarn constraints

      - name: "Build All Packages"
        run: yarn turbo run build --output-logs=full --log-order=stream

      - name: "Execute Hardened Sync"
        run: yarn workspace @hexagen/sync run cli sync --force --allow-dirty

      - name: "Verify Build After Sync"
        run: yarn turbo run build --output-logs=full --log-order=stream --force

      - name: "Verify TypeCheck After Sync"
        run: yarn turbo run typecheck --output-logs=full --log-order=stream

      - name: "Verify Architecture (arch-linter, strict)"
        # A REAL architecture gate. The previous `sync --dry-run` was toothless:
        # under --dry-run the sync engine short-circuits the linter entirely
        # ("[DRY-RUN] would run arch-linter"), so a boundary violation could
        # never fail this step (AUD-010). `--strict` runs the linter for real
        # and aborts on a violation — or on a timeout, which is treated as
        # "could not verify", never a silent pass. The sync itself is a no-op
        # here (the tree was already converged by "Execute Hardened Sync").
        run: yarn workspace @hexagen/sync run cli sync --strict --allow-dirty

      - name: "Verify Template Questions Generator Parity"
        # Asserts the two generated wizard modules are in sync with the manifests
        # under packages/template-engine/templates:
        #   - template-questions-step/template-questions.generated.ts (id -> questions)
        #   - add-ons-step/template-manifest.generated.ts (id -> name/description/
        #     requires/conflicts, which the add-ons catalog merges with curated
        #     presentation fields)
        # If a manifest was edited without re-running
        # `yarn workspace web gen:template-questions`, this step fails with
        # instructions. It also hard-fails on a `requires` naming a non-existent
        # template.
        run: yarn workspace web check:template-questions

      - name: "Run Test Suite"
        run: yarn turbo run test --output-logs=full --log-order=stream
