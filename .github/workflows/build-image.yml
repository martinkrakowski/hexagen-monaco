# Build, scan, sign and publish the hexagen-web image (platform templates/build-image.yml,
# single-image form). The file name is part of the signing identity Kyverno accepts.
# - Only main publishes; its images deploy to Kubernetes (amd64 staging, arm64 production).
# - Pull requests build both platforms and scan, with read-only permissions: no push, no signature.
# - Runs on solstice's ephemeral runners: a fresh container per job, deleted afterwards.
name: build-image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-image-${{ github.ref }}
  # Never cancel main: a cancel between push and sign would leave an unsigned image in GHCR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  IMAGE: ghcr.io/martinkrakowski/hexagen-web
  CONTEXT: .
  DOCKERFILE: apps/web/Dockerfile
  # The three public build args (formerly computed by the removed deploy.yml); passed quoted from env, never inlined.
  LLM_AVAILABLE: ${{ secrets.WEB_LLM_API_KEY != '' || secrets.LLM_API_KEY != '' }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}
  FREE_TIER_MODEL: ${{ secrets.NEXT_PUBLIC_FREE_TIER_MODEL }}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Public repository: pull-request jobs run on GitHub's hosted runners (free for public
      # repositories), never on solstice, where a fork's pull request would run its code.
      # amd64 only: an arm64 build under QEMU on a 2-CPU hosted runner can run for hours.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Install trivy (pinned, checksum-verified; the solstice builder's version)
        run: |
          curl -sfL --proto '=https' --tlsv1.2 -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
      - name: Build the amd64 image (no push; arm64 is built and scanned at publish)
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_LLM_AVAILABLE="$LLM_AVAILABLE" \
            --build-arg NEXT_PUBLIC_LLM_MODEL="$LLM_MODEL" \
            --build-arg NEXT_PUBLIC_FREE_TIER_MODEL="$FREE_TIER_MODEL" \
            -f "$DOCKERFILE" "$CONTEXT"
      - name: Scan the amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load -t "scan-$GITHUB_RUN_ID" \
            --build-arg NEXT_PUBLIC_LLM_AVAILABLE="$LLM_AVAILABLE" \
            --build-arg NEXT_PUBLIC_LLM_MODEL="$LLM_MODEL" \
            --build-arg NEXT_PUBLIC_FREE_TIER_MODEL="$FREE_TIER_MODEL" \
            -f "$DOCKERFILE" "$CONTEXT"
          trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "scan-$GITHUB_RUN_ID"
      - name: Clean up
        if: always()
        run: |
          docker image rm "scan-$GITHUB_RUN_ID" 2>/dev/null || true
          docker builder prune -af --filter until=24h >/dev/null 2>&1 || true

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Each platform builds natively on GitHub's hosted runners (free for public repositories):
    # QEMU-emulated arm64 on a 2-CPU runner could run for hours. Each leg pushes a per-platform tag;
    # publish joins them into the one multi-platform image that is scanned, signed and promoted.
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Before setup-buildx: buildx records its builder under DOCKER_CONFIG, so changing DOCKER_CONFIG
      # afterwards drops back to the plain docker driver, which cannot write attestations.
      - name: Keep the registry login inside this job's temp directory
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to GHCR with this job's own token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push this platform
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$ARCH" --push --provenance=mode=max \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_LLM_AVAILABLE="$LLM_AVAILABLE" \
            --build-arg NEXT_PUBLIC_LLM_MODEL="$LLM_MODEL" \
            --build-arg NEXT_PUBLIC_FREE_TIER_MODEL="$FREE_TIER_MODEL" \
            -t "$IMAGE:sha-${GITHUB_SHA::12}-$ARCH" \
            -f "$DOCKERFILE" "$CONTEXT"
      - name: Log out and clean up
        if: always()
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"
          docker builder prune -af --filter until=24h >/dev/null 2>&1 || true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Public repository: no job runs on solstice. A fork's pull request runs the workflow as
      # changed in that PR, so any self-hosted runner registered here would be reachable from it.
      # The signature identity Kyverno checks is this workflow on main, not the runner.
      - name: Keep the registry login inside this job's temp directory
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Install cosign, syft and trivy (pinned, checksum-verified; the solstice builder's versions)
        run: |
          cd "$RUNNER_TEMP"
          curl -sfL --proto '=https' --tlsv1.2 -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  cosign" | sha256sum -c -
          curl -sfL --proto '=https' --tlsv1.2 -o syft.tgz https://github.com/anchore/syft/releases/download/v1.54.0/syft_1.54.0_linux_amd64.tar.gz
          echo "54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860  syft.tgz" | sha256sum -c -
          curl -sfL --proto '=https' --tlsv1.2 -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft && tar -xzf trivy.tgz trivy
          sudo install -m 755 cosign syft trivy /usr/local/bin/ && rm -f cosign syft syft.tgz trivy trivy.tgz
      - name: Log in to GHCR with this job's own token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Join both platforms into one image
        run: |
          tag="$IMAGE:sha-${GITHUB_SHA::12}"
          docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"
          echo "DIGEST=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_ENV"
      - name: Scan the pushed image, both platforms
        run: |
          for p in linux/amd64 linux/arm64; do
            trivy image --platform "$p" --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE@$DIGEST"
          done
      - name: SBOM, signature and SBOM attestation (keyless, this workflow's identity)
        run: |
          syft "$IMAGE@$DIGEST" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          # Classic signature format until Kyverno 1.19's verification of cosign 3 bundles is proved.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"
          cosign attest --yes --new-bundle-format=false --use-signing-config=false --type spdxjson \
            --predicate "$RUNNER_TEMP/sbom.spdx.json" "$IMAGE@$DIGEST"
      - name: Record the digest for the promotion pull request
        run: |
          echo "Promote with a platform pull request: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out and clean up
        if: always()
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"
          docker builder prune -af --filter until=24h >/dev/null 2>&1 || true
