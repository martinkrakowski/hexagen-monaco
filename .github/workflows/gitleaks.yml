# Secret scan of the working tree with gitleaks (vault migration plan P7). Pinned binary,
# checksum-verified; findings are printed redacted. Allowlists live in .gitleaks.toml and name
# both the file and the rule of a reviewed fixture.
name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sfL --proto '=https' --tlsv1.2 -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          mkdir -p bin && tar -xzf gitleaks.tgz -C bin gitleaks && rm -f gitleaks.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1
