name: Deploy to Production VPS

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main (pinned)
        with:
          tool-cache: false
          docker-images: false

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_LLM_AVAILABLE=${{ secrets.LLM_API_KEY != '' }} \
            --build-arg NEXT_PUBLIC_LLM_MODEL=${{ secrets.LLM_MODEL }} \
            --build-arg NEXT_PUBLIC_FREE_TIER_MODEL=${{ secrets.NEXT_PUBLIC_FREE_TIER_MODEL }} \
            -f apps/web/Dockerfile -t hexagen-monaco-web:prod .

      - name: Save Image to tar.gz
        run: |
          docker save hexagen-monaco-web:prod | gzip > hexagen-web.tar.gz
          # Stage the compose at the runner root so it lands at
          # /opt/hexagen-monaco/docker-compose.prod.yml — co-located with the
          # generated .env, which env_file resolves relative to.
          cp deploy/docker-compose.prod.yml docker-compose.prod.yml

      - name: Transfer artifacts to VPS via SCP
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # appleboy/scp-action splits `source` on commas, not newlines — a
          # multi-line block becomes one bogus path ("tar: empty archive").
          source: "hexagen-web.tar.gz,docker-compose.prod.yml"
          target: "/opt/hexagen-monaco/"
          overwrite: true

      - name: Execute Deployment Commands on VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        # Map secrets into the runner env so `envs:` can forward real values to
        # the remote shell. NOTE: GitHub forbids secret names with a GITHUB_
        # prefix, so the OAuth app credentials are stored as GH_OAUTH_ID /
        # GH_OAUTH_SECRET and rewritten to GITHUB_ID / GITHUB_SECRET (what
        # NextAuth reads) when the .env is written below.
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          # Production canonical URL — NextAuth builds the OAuth redirect_uri from
          # this; must match the GitHub OAuth App's Authorization callback URL
          # (https://app.hexagen-monaco.cloud/api/auth/callback/github).
          NEXTAUTH_URL: https://app.hexagen-monaco.cloud
          GH_OAUTH_ID: ${{ secrets.GH_OAUTH_ID }}
          GH_OAUTH_SECRET: ${{ secrets.GH_OAUTH_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # A3 staged-generation canary (repo VARIABLES, not secrets — they are
          # not sensitive, and `gh variable set` + a deploy re-run is the whole
          # flip). Unset variables become empty strings, which `selectPipeline`
          # fails closed to the stub (empty pin → canary path; empty/NaN percent
          # → 0 = ship dark). Runbook:
          # docs/planning/staged-generation-canary-runbook.md
          STAGED_GENERATION_PIPELINE: ${{ vars.STAGED_GENERATION_PIPELINE }}
          STAGED_GENERATION_FULL_PERCENT: ${{ vars.STAGED_GENERATION_FULL_PERCENT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: AUTH_SECRET, NEXTAUTH_URL, GH_OAUTH_ID, GH_OAUTH_SECRET, LLM_API_KEY, LLM_BASE_URL, LLM_MODEL, STAGED_GENERATION_PIPELINE, STAGED_GENERATION_FULL_PERCENT
          # set -eu (POSIX-safe; appleboy/ssh-action has no `set -e` by default)
          # so a failed `docker load` aborts instead of silently leaving the old
          # container up. pipefail is omitted intentionally — the remote /bin/sh
          # may be dash, where `set -o pipefail` would itself error, and there are
          # no pipes in this script.
          # Hardening: `umask 077` + `chmod 600 .env` keep secrets non-world-readable;
          # the line-count guard catches a secret with an embedded newline corrupting
          # the dotenv; `--force-recreate` guarantees rotated `.env` values reach the
          # container (env_file is read at container-creation time, so an unchanged
          # image would otherwise keep the old env); `--wait` fails the deploy if the
          # new container doesn't become healthy (see the compose healthcheck).
          #
          # Cleanup is `docker image prune -f` (dangling images only — reclaims the
          # old :prod layers `docker load` just orphaned). It is deliberately NOT
          # `docker system prune -a --volumes`: this VPS is multi-tenant, and the
          # host-wide form would delete other projects' volumes (e.g. a co-tenant's
          # Redis data) and images whenever their containers happen to be stopped.
          script: "set -eu\n\
            cd /opt/hexagen-monaco\n\
            umask 077\n\
            cat <<EOF > .env\n\
            NEXTAUTH_URL=\"$NEXTAUTH_URL\"\n\
            NEXTAUTH_SECRET=\"$AUTH_SECRET\"\n\
            AUTH_SECRET=\"$AUTH_SECRET\"\n\
            GITHUB_ID=\"$GH_OAUTH_ID\"\n\
            GITHUB_SECRET=\"$GH_OAUTH_SECRET\"\n\
            LLM_API_KEY=\"$LLM_API_KEY\"\n\
            LLM_BASE_URL=\"$LLM_BASE_URL\"\n\
            LLM_MODEL=\"$LLM_MODEL\"\n\
            STAGED_GENERATION_PIPELINE=\"$STAGED_GENERATION_PIPELINE\"\n\
            STAGED_GENERATION_FULL_PERCENT=\"$STAGED_GENERATION_FULL_PERCENT\"\n\
            EOF\n\
            chmod 600 .env\n\
            [ \"$(wc -l < .env)\" -eq 10 ] || { echo 'FATAL: .env line count != 10 — keep this in sync with the heredoc keys above (embedded newline in a secret?)' >&2; exit 1; }\n\
            docker load < hexagen-web.tar.gz\n\
            docker image inspect hexagen-monaco-web:prod >/dev/null\n\
            docker compose -f docker-compose.prod.yml up -d --force-recreate --wait --wait-timeout 90\n\
            rm hexagen-web.tar.gz\n\
            docker image prune -f"
