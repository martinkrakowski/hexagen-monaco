name: Deploy to Production VPS

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_LLM_AVAILABLE=${{ secrets.LLM_API_KEY != '' }} \
            --build-arg NEXT_PUBLIC_LLM_MODEL=${{ secrets.LLM_MODEL }} \
            --build-arg NEXT_PUBLIC_FREE_TIER_MODEL=${{ secrets.NEXT_PUBLIC_FREE_TIER_MODEL }} \
            -f apps/web/Dockerfile -t hexagen-monaco-web:prod .

      - name: Save Image to tar.gz
        run: |
          docker save hexagen-monaco-web:prod | gzip > hexagen-web.tar.gz

      - name: Transfer tar.gz to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "hexagen-web.tar.gz"
          target: "/opt/hexagen-monaco/"
          overwrite: true

      - name: Execute Deployment Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        # Map secrets into the runner env so `envs:` can forward real values to
        # the remote shell. NOTE: GitHub forbids secret names with a GITHUB_
        # prefix, so the OAuth app credentials are stored as GH_OAUTH_ID /
        # GH_OAUTH_SECRET and rewritten to GITHUB_ID / GITHUB_SECRET (what
        # NextAuth reads) when the .env is written below.
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          # Production canonical URL — NextAuth builds the OAuth redirect_uri from
          # this; must match the GitHub OAuth App's Authorization callback URL
          # (https://app.hexagen-monaco.cloud/api/auth/callback/github).
          NEXTAUTH_URL: https://app.hexagen-monaco.cloud
          GH_OAUTH_ID: ${{ secrets.GH_OAUTH_ID }}
          GH_OAUTH_SECRET: ${{ secrets.GH_OAUTH_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: AUTH_SECRET, NEXTAUTH_URL, GH_OAUTH_ID, GH_OAUTH_SECRET, LLM_API_KEY, LLM_BASE_URL, LLM_MODEL
          script: "cd /opt/hexagen-monaco\n\
            cat <<EOF > .env\n\
            NEXTAUTH_URL=\"$NEXTAUTH_URL\"\n\
            NEXTAUTH_SECRET=\"$AUTH_SECRET\"\n\
            AUTH_SECRET=\"$AUTH_SECRET\"\n\
            GITHUB_ID=\"$GH_OAUTH_ID\"\n\
            GITHUB_SECRET=\"$GH_OAUTH_SECRET\"\n\
            LLM_API_KEY=\"$LLM_API_KEY\"\n\
            LLM_BASE_URL=\"$LLM_BASE_URL\"\n\
            LLM_MODEL=\"$LLM_MODEL\"\n\
            EOF\n\
            docker compose down\n\
            docker rmi hexagen-monaco-web:prod || true\n\
            docker load < hexagen-web.tar.gz\n\
            docker compose up -d\n\
            rm hexagen-web.tar.gz\n\
            docker system prune -a -f --volumes"
