name: Deploy to Production VPS

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main (pinned)
        with:
          tool-cache: false
          docker-images: false

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_LLM_AVAILABLE=${{ secrets.WEB_LLM_API_KEY != '' || secrets.LLM_API_KEY != '' }} \
            --build-arg NEXT_PUBLIC_LLM_MODEL=${{ secrets.LLM_MODEL }} \
            --build-arg NEXT_PUBLIC_FREE_TIER_MODEL=${{ secrets.NEXT_PUBLIC_FREE_TIER_MODEL }} \
            -f apps/web/Dockerfile -t hexagen-monaco-web:prod .

      - name: Save Image to tar.gz
        run: |
          docker save hexagen-monaco-web:prod | gzip > hexagen-web.tar.gz
          # Stage the compose at the runner root so it lands at
          # /opt/hexagen-monaco/docker-compose.prod.yml — co-located with the
          # generated .env, which env_file resolves relative to.
          cp deploy/docker-compose.prod.yml docker-compose.prod.yml

      - name: Transfer artifacts to VPS via SCP
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # appleboy/scp-action splits `source` on commas, not newlines — a
          # multi-line block becomes one bogus path ("tar: empty archive").
          source: "hexagen-web.tar.gz,docker-compose.prod.yml"
          target: "/opt/hexagen-monaco/"
          overwrite: true

      - name: Execute Deployment Commands on VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        # Map secrets into the runner env so `envs:` can forward real values to
        # the remote shell. NOTE: GitHub forbids secret names with a GITHUB_
        # prefix, so the OAuth app credentials are stored as GH_OAUTH_ID /
        # GH_OAUTH_SECRET and rewritten to GITHUB_ID / GITHUB_SECRET (what
        # NextAuth reads) when the .env is written below.
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          # Production canonical URL — NextAuth builds the OAuth redirect_uri from
          # this; must match the GitHub OAuth App's Authorization callback URL
          # (https://app.hexagen-monaco.cloud/api/auth/callback/github).
          NEXTAUTH_URL: https://app.hexagen-monaco.cloud
          GH_OAUTH_ID: ${{ secrets.GH_OAUTH_ID }}
          GH_OAUTH_SECRET: ${{ secrets.GH_OAUTH_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # Web-feature LLM key: chat server-key path + governance suggestion
          # routes resolve WEB_LLM_API_KEY ?? LLM_API_KEY (resolveWebLlmApiKey,
          # PR #301). MUST be set before the mercury flip unsets LLM_API_KEY,
          # or chat degrades to auth/BYOK-only and governance returns empty.
          WEB_LLM_API_KEY: ${{ secrets.WEB_LLM_API_KEY }}
          # Mercury provider family + stage-1 refine cascade. Keys are repo
          # SECRETS; non-sensitive knobs are repo VARIABLES (same split as the
          # canary flags above). Unset → empty string → every consumer treats
          # it as unset (provider skipped / default model / reasoning field
          # omitted / cascade off). Flip runbook:
          # docs/planning/mercury-2-prod-flip-runbook.md
          # NOTE: LLM_ESCALATION_MODEL is deliberately NOT plumbed — the
          # stage-3 escalation model injection is provider-unscoped, and a
          # foreign model name in an Inception-only chain 404s every
          # escalation retry. Keeping it out of the heredoc makes "unset in
          # prod" structural.
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
          INCEPTION_MODEL: ${{ vars.INCEPTION_MODEL }}
          LLM_REASONING: ${{ vars.LLM_REASONING }}
          STAGE1_REFINER_API_KEY: ${{ secrets.STAGE1_REFINER_API_KEY }}
          STAGE1_REFINER_BASE_URL: ${{ vars.STAGE1_REFINER_BASE_URL }}
          STAGE1_REFINER_MODEL: ${{ vars.STAGE1_REFINER_MODEL }}
          STAGE1_REFINER_MODE: ${{ vars.STAGE1_REFINER_MODE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: AUTH_SECRET, NEXTAUTH_URL, GH_OAUTH_ID, GH_OAUTH_SECRET, LLM_API_KEY, LLM_BASE_URL, LLM_MODEL, WEB_LLM_API_KEY, INCEPTION_API_KEY, INCEPTION_MODEL, LLM_REASONING, STAGE1_REFINER_API_KEY, STAGE1_REFINER_BASE_URL, STAGE1_REFINER_MODEL, STAGE1_REFINER_MODE
          # set -eu (POSIX-safe; appleboy/ssh-action has no `set -e` by default)
          # so a failed `docker load` aborts instead of silently leaving the old
          # container up. pipefail is omitted intentionally — the remote /bin/sh
          # may be dash, where `set -o pipefail` would itself error, and there are
          # no pipes in this script.
          # Hardening: `umask 077` + `chmod 600 .env` keep secrets non-world-readable;
          # the line-count guard catches a secret with an embedded newline corrupting
          # the dotenv; `--force-recreate` guarantees rotated `.env` values reach the
          # container (env_file is read at container-creation time, so an unchanged
          # image would otherwise keep the old env); `--wait` fails the deploy if the
          # new container doesn't become healthy (see the compose healthcheck).
          #
          # After the container is healthy, a writability probe asserts the
          # free-tier quota volume (`quota-data:/data`) is writable by the app
          # user (uid 1001 `nextjs`). The store is fail-open, so a mis-seeded
          # volume would silently disable enforcement behind a green healthcheck;
          # `exec -T -u nextjs web sh -c 'test -w /data'` runs access(W_OK) as
          # that user and fails the deploy if not. It is a deploy-time gate only
          # and does NOT change the runtime fail-open behaviour.
          #
          # Cleanup is `docker image prune -f` (dangling images only — reclaims the
          # old :prod layers `docker load` just orphaned). It is deliberately NOT
          # `docker system prune -a --volumes`: this VPS is multi-tenant, and the
          # host-wide form would delete other projects' volumes (e.g. a co-tenant's
          # Redis data) and images whenever their containers happen to be stopped.
          script: "set -eu\n\
            cd /opt/hexagen-monaco\n\
            umask 077\n\
            cat <<EOF > .env\n\
            NEXTAUTH_URL=\"$NEXTAUTH_URL\"\n\
            NEXTAUTH_SECRET=\"$AUTH_SECRET\"\n\
            AUTH_SECRET=\"$AUTH_SECRET\"\n\
            GITHUB_ID=\"$GH_OAUTH_ID\"\n\
            GITHUB_SECRET=\"$GH_OAUTH_SECRET\"\n\
            LLM_API_KEY=\"$LLM_API_KEY\"\n\
            LLM_BASE_URL=\"$LLM_BASE_URL\"\n\
            LLM_MODEL=\"$LLM_MODEL\"\n\
            WEB_LLM_API_KEY=\"$WEB_LLM_API_KEY\"\n\
            INCEPTION_API_KEY=\"$INCEPTION_API_KEY\"\n\
            INCEPTION_MODEL=\"$INCEPTION_MODEL\"\n\
            LLM_REASONING=\"$LLM_REASONING\"\n\
            STAGE1_REFINER_API_KEY=\"$STAGE1_REFINER_API_KEY\"\n\
            STAGE1_REFINER_BASE_URL=\"$STAGE1_REFINER_BASE_URL\"\n\
            STAGE1_REFINER_MODEL=\"$STAGE1_REFINER_MODEL\"\n\
            STAGE1_REFINER_MODE=\"$STAGE1_REFINER_MODE\"\n\
            EOF\n\
            chmod 600 .env\n\
            [ \"$(wc -l < .env)\" -eq 16 ] || { echo 'FATAL: .env line count != 16 — keep this in sync with the heredoc keys above (embedded newline in a secret?)' >&2; exit 1; }\n\
            docker load < hexagen-web.tar.gz\n\
            docker image inspect hexagen-monaco-web:prod >/dev/null\n\
            docker compose -f docker-compose.prod.yml up -d --force-recreate --wait --wait-timeout 90\n\
            docker compose -f docker-compose.prod.yml exec -T -u nextjs web sh -c 'test -w /data' || { echo 'FATAL: /data is not writable by the app user (uid 1001) - free-tier quota would silently fail-open with no enforcement; check the quota-data volume ownership.' >&2; exit 1; }\n\
            rm hexagen-web.tar.gz\n\
            docker image prune -f"
