name: "PR-Agent UI Review"

# LLM reviewer specialised in DESIGN.md UI contracts. Complements CodeRabbit
# (ADR / verifier-defect class) and Qodo (best_practices.md). Not a merge gate:
# a green check is not a review — see .agents/REVIEW.md.
#
# Config in .pr_agent.toml is read from the default branch. A missing
# repo_context_files entry is skipped, not a crash — but until this workflow
# and toml are on main, only keys in the env block actually apply. Keep env
# and toml in agreement. Do not set repo_context_from_default_branch=false to
# "read the PR head": false reads the PR *target* (still main), never head.
#
# Pin is the multi-arch index digest of pragent/pr-agent:0.42.0-github_action,
# not uses: the-pr-agent/pr-agent@<sha> — that repo's action.yaml FROM's the
# rolling :github_action tag. Version tags are immutable; rolling tags are not.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

# restricted_mode skips contents:write operations. contents:read is enough
# for the GitHub API to fetch the PR and repo context files.
permissions:
  contents: read
  pull-requests: write
  issues: write

# Group by PR number: issue_comment runs with github.ref == the default
# branch, so grouping by ref would cancel unrelated PRs.
# Keyed by PR *and sender type*, not by PR alone.
#
# Workflow-level concurrency is evaluated when a run is QUEUED -- before the
# job-level `if` below ever runs. So with a PR-only key, any bot comment
# queued a run in this PR's group, cancel-in-progress killed the review that
# was already running, and only then did the bot-sender guard skip the new
# run. The review died and nothing replaced it.
#
# That was not a rare race: CodeRabbit and Qodo comment within seconds of a PR
# opening, which is exactly while this job is still pulling its image.
# Observed on #595 --
#   02:22:37  pull_request  PR-Agent starts
#   02:22:43  issue_comment CodeRabbit comments (same group)
#   02:22:46  pull_request  CANCELLED, mid docker-pull
# Both #594 and #595 got no review at all.
#
# Splitting on sender type gives bot-triggered runs their own group, where
# they can only cancel each other (and are skipped anyway).
#
# That fix was HALF the hole. It stopped *bots* cancelling the review; a
# HUMAN comment still landed in the same group as the pull_request run and
# killed it exactly the same way. Observed on #609 --
#   17:58:07  pull_request   review starts        (sender: a human)
#   17:58:11  bots comment                        -> own group, skipped (the
#                                                    sender-type fix working)
#   17:58:17  the PR author posts a summary       -> SAME group
#   17:58:20  pull_request   CANCELLED, mid docker-pull
#   17:58:19  issue_comment  skipped (not a slash command)
# Review dead, nothing replaced it. Same failure, human sender.
#
# This is not an edge case: posting a reviewer's-guide comment right after
# opening a PR is routine practice here, which means the review was being
# killed on essentially every PR that followed it. A cancelled run still
# reports as a red check, so it looked like a flaky bot rather than a
# self-inflicted cancel.
#
# Root cause both times: cancel-in-progress treats every run in the group as
# redundant, but a comment-triggered run and a pull_request-triggered run are
# not alternatives to each other -- one reviews the diff, the other answers a
# command, and most comment runs do neither because the job guard skips them.
#
# So the key is not the event, it is "does this run produce a review". Keying
# on the event alone was the obvious fix and it was wrong in the other
# direction: it put `/review` in a different group from the auto review, so an
# explicit /review would no longer supersede the run it was asking to redo --
# both would proceed and post duplicate reviews. Trading a cancelled review
# for a doubled one is not a fix. (Caught in review on this PR.)
#
# Review-producing runs share a group and supersede each other, as intended:
#   - every `pull_request` run
#   - an `issue_comment` whose body is exactly the /review command
# Everything else -- /describe, /improve, /ask, /help, and ordinary comments --
# gets the isolated group. Those are not alternatives to a review: they do
# different work, so running one concurrently with a review is correct.
#
# The /review test is the exact-match form the job guard uses, deliberately
# not startsWith(body, '/review'). A loose test would let `/reviewXYZ` join
# the review group and cancel a real review, and the guard would then skip it
# -- which is precisely the bug this whole block exists to prevent, rebuilt one
# level down.
concurrency:
  group: >-
    pr-agent-${{ github.event.pull_request.number || github.event.issue.number
    }}-${{ (github.event_name == 'pull_request'
    || github.event.comment.body == '/improve'
    || startsWith(github.event.comment.body, '/improve '))
    && 'improve'
    || (github.event.comment.body == '/review'
    || startsWith(github.event.comment.body, '/review '))
    && 'review' || 'other' }}-${{ github.event.sender.type }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: "PR-Agent UI contract review"
    # pull_request: skip drafts (ready_for_review re-fires when undrafted).
    # issue_comment: only slash commands from trusted authors. That is the
    # intentional override so a maintainer can /review a draft. Do not fetch
    # the PR to skip drafts here — that would remove the override.
    # author_association gate: issue_comment runs on the base repo with
    # secrets; pull_request from a fork does not get OPENROUTER_KEY.
    #
    # The command list is an ALLOWLIST, not `startsWith(body, '/')`, because an
    # unrecognised command is not an error to PR-Agent: it logs
    # `WARNING Unknown command: <x>` and exits 0, so the check goes GREEN
    # having done nothing. That is indistinguishable from a completed review
    # unless somebody opens the log -- and it already cost a cycle, when
    # `/agentic_review` (which the deprecation notice recommends) turned out
    # not to exist in the pinned 0.42.0 image. 0.42.0 is the newest tag
    # published, so upgrading is not an option: /review remains correct.
    #
    # Skipping is the honest outcome for a command this image cannot serve --
    # no run, no green check claiming success. Prevention beats detection here:
    # the alternative is grepping the action's own stdout from a later step,
    # which is fragile and only reports the waste after paying for it.
    #
    # Each command is matched as the WHOLE body or the body up to a space, so
    # `/reviewers please look` and `/reviewXYZ` no longer match `/review`.
    # GHA expressions have no split(), but exact-equality plus a
    # trailing-space prefix covers both real forms without the collision.
    # `/ask` is space-only: it is meaningless without a question after it.
    if: >-
      github.event.sender.type != 'Bot'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event_name != 'issue_comment' || (
        github.event.issue.pull_request
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && (
          github.event.comment.body == '/review'
          || startsWith(github.event.comment.body, '/review ')
          || github.event.comment.body == '/describe'
          || startsWith(github.event.comment.body, '/describe ')
          || github.event.comment.body == '/improve'
          || startsWith(github.event.comment.body, '/improve ')
          || startsWith(github.event.comment.body, '/ask ')
          || github.event.comment.body == '/help'
          || startsWith(github.event.comment.body, '/help ')
        )
      ))
    runs-on: ubuntu-latest
    # The action has no internal deadline and an LLM call can hang. Without
    # this the job inherits GitHub's 360-minute default and holds a runner for
    # six hours to produce nothing. Observed healthy runs finish in ~1 minute.
    # Raised from 15 after observing a single-chunk /improve run take 812s
    # against a 70s median -- ~11.6x degraded on openrouter/tencent/hy3, with
    # 88 seconds of margin left. The call did not error, so fallback_models
    # never engaged: fallback covers failures, and a slow call is not one.
    #
    # 25 buys headroom for that observed degradation. It is NOT sized for
    # serial chunks: parallel_calls defaults true, so wall-clock is roughly the
    # slowest single call rather than the sum, and max_number_of_calls: 6 does
    # not multiply this number.
    timeout-minutes: 25
    steps:
      - name: "PR Agent"
        uses: docker://pragent/pr-agent@sha256:b81235c3bddc551939a1feca8926f4b6e8abcec2ae5bf4620424f8f56dd9cb93 # 0.42.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dynaconf/PR-Agent OpenRouter secret: openrouter__key. Dotted
          # OPENROUTER.KEY is accepted in some GHA examples; __ is the
          # documented form and a legal POSIX env name.
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          config.restricted_mode: "true"
          config.model: "openrouter/tencent/hy3"
          # claude-3.5-sonnet is NOT in the OpenRouter catalogue — the old
          # fallback could not have resolved. Verified against /api/v1/models.
          config.fallback_models: '["openrouter/anthropic/claude-haiku-4.5"]'
          # hy3's real window per OpenRouter: 262144. This was 64000, which
          # silently capped max_model_tokens below it.
          config.custom_model_max_tokens: "262144"
          # Mirrors .pr_agent.toml, per this file's own "keep env and toml in
          # agreement" rule. custom_model_max_tokens declares the model's
          # capacity; max_model_tokens caps what PR-Agent actually spends and
          # defaults to 32000 regardless — which is what was pruning diffs and
          # dropping files from reviews. See the toml for the measurements.
          config.max_model_tokens: "200000"
          # DESIGN.md and best_practices.md exist on main today. The rubric
          # does not — missing entries are skipped. extra_instructions below
          # is what makes this PR a UI-contract review rather than AGENTS.md
          # defaults (repo_context_files default is ["AGENTS.md"], cap 500).
          config.repo_context_files: '[".agents/PR_REVIEW_RUBRIC.md", "best_practices.md", "DESIGN.md"]'
          config.repo_context_max_lines: "3000"
          # Bound the LLM call INSIDE the container, so a slow model aborts
          # and fallback_models can engage. Without it the only deadline is
          # timeout-minutes, which kills the whole job and attempts no
          # fallback at all -- the failure mode observed on #617.
          #
          # Honest caveat: PR-Agent documents ai_timeout with a 120s default,
          # and an 812s call completed anyway, so this path may not honour it.
          # Set explicitly because it costs nothing and is the correct
          # configuration either way; timeout-minutes remains the deadline
          # that definitely works.
          config.ai_timeout: "600"
          # See .pr_agent.toml for the 3/3 correlation showing this reads any
          # `#NNN` in a PR body as a ticket the PR must implement.
          pr_reviewer.require_ticket_analysis_review: "false"
          # SWAPPED. auto_review emits the "PR Reviewer Guide" -- an effort
          # estimate, a security flag, and a focus-areas section that is empty
          # whenever it has nothing to say. That is its output format, not a
          # degraded version of one: /review never produces line-anchored
          # suggestions no matter how it is configured. The reviews this bot
          # was added for come from /improve.
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # /improve NEVER reads pr_reviewer.extra_instructions, so the
          # UI-contract mandate is carried here or the bot becomes a generic
          # suggester -- which is the overlap with CodeRabbit and Qodo that
          # having a third reviewer is supposed to avoid.
          pr_code_suggestions.extra_instructions: |
            You are the adversarial UI-contract reviewer for this repository. Your job is
            to find defects, not to summarise the PR. Assume the code is wrong and look
            for the input that proves it.

            Every finding MUST carry a concrete failure scenario: specific inputs or
            state, and the wrong output, crash, or silent no-op that results. "This could
            be fragile" is not a finding. "With `note: ""` the cell renders blank, which
            reads as a value rather than a missing reading" is a finding.

            Hunt these classes first. They are the ones that have actually shipped here:

            1. GATES THAT PASS WITHOUT RUNNING. A guard that asserts a population is
               clean without first asserting the population is non-empty. A loop that
               iterates zero times and reports success. A config glob that matches no
               files and is silently dropped. A check whose fixture creates the very
               thing it then verifies exists.
            2. LOUD FAILURES MADE QUIET. A catch that swallows, returns null/false/[],
               or coerces an unknown value to a default. Ask of every catch: can the
               caller distinguish "nothing was wrong" from "I could not tell"?
            3. TESTS THAT CANNOT FAIL. Would this test fail if the code under it were
               wrong? Mocked or injected past the line that actually breaks in
               production? Asserting an absence after an unchecked write?
            4. RUNTIME/BUILD DIVERGENCE. Something present in dev and absent in the
               packaged artifact, or built on one Node major and run on another.
            5. DESIGN.md VIOLATIONS. Spacing must resolve to the §4.7 scale
               (1,2,3,4,6,8,12,16) -- fractional Tailwind steps like mt-0.5 or gap-1.5
               are violations and no gate catches them inside features/. Do not invent
               tokens, utilities, or exception patterns absent from §4.8 / §4.9. Cite
               section numbers; never paraphrase a rule that has one.

            For every fix you propose, state explicitly what it does to inputs the
            current code already handles, and whether it converts a loud failure into a
            quiet one. A fix that trades a crash for a wrong answer is worse than the bug.

            Do not re-raise what CodeRabbit and Qodo own (verifier defects,
            assertion-style, manifest inventory completeness). Do not comment to
            acknowledge, praise, or summarise. Prefer silence to a speculative finding:
            one real defect is worth more than five plausible ones, and a wrong finding
            costs a human more time than it saves.
          # Inline and line-anchored, not a summary table. Default is false,
          # which posts one collapsed comment -- the format that reads as
          # "nothing happened" even when it found something.
          pr_code_suggestions.commitable_code_suggestions: "true"
          # Do not post a comment when there is nothing to say. Default true is
          # what produces the empty guide on every PR; silence is a better
          # signal than a table of three vague rows.
          pr_code_suggestions.publish_output_no_suggestions: "false"
          # 0.42.0 defaults this on; pinned explicitly so a future image change
          # cannot quietly turn the bot into a style-nitpicker.
          pr_code_suggestions.focus_only_on_problems: "true"
          # Depth. Defaults are 3 and 3, which on a PR this size processes only
          # part of the diff and stops at three findings per section. Doubling
          # both is what "highly detailed" actually costs; the job's
          # timeout-minutes: 15 bounds the blast radius.
          pr_code_suggestions.num_code_suggestions_per_chunk: "6"
          pr_code_suggestions.max_number_of_calls: "6"
          # PINNED, not inherited. The 25-minute timeout above is justified by
          # wall-clock being roughly the slowest single call rather than the sum
          # of six -- which is true only while chunks run in parallel. That is
          # the 0.42.0 default, verified against the pinned image's own
          # configuration.toml, but a default is not a guarantee: an image bump
          # that flipped it would turn 6 chunks at the observed 812s into ~81
          # minutes against a 25-minute cap, and the first symptom would be a
          # killed job with no review. Stating it explicitly costs one line and
          # removes the assumption.
          pr_code_suggestions.parallel_calls: "true"
          # Deliberately NOT raised above 0: filtering by score is the opposite
          # of adversarial. focus_only_on_problems already excludes style noise,
          # so anything filtered here would be a real finding scored low.
          pr_code_suggestions.suggestions_score_threshold: "0"
          pr_reviewer.extra_instructions: |
            You are the UI-contract reviewer for this repository. Enforce DESIGN.md.
            Do not re-raise findings that belong to CodeRabbit or Qodo (verifier
            defects, assertion-style, manifest inventory completeness).
            Cite DESIGN.md section numbers. Do not paraphrase a rule that already
            has a section; name it.
            When you propose a fix, say what it does to inputs the current code
            already handles — particularly whether it turns a loud failure into a
            quiet one.
            Flag: DESIGN.md §4.8 gaps the ESLint rule misses (template-literal
            class names; apps/web/components/ outside primitives/); §4.7 4px
            grid; §3.4 untyped/as-any escapes and template-engine payload;
            §4.9 inline styles outside CanvasNodeStyleAdapter.tsx.
