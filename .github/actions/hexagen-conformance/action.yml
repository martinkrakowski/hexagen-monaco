# Hexagen conformance composite action.
#
# Contract version: 0.10.0 (unpublished). Pin this action by commit SHA until
# 0.10.0 is published. Do NOT assume the published 0.9.0 tarball of
# @hexagen-monaco/sync or @hexagen-monaco/arch-linter ships adopt, report,
# or per-PR baseline diffing — those flags do not exist on 0.9.0.
#
# Never push a vX.Y.Z tag from a change that only lands this action.
name: "Hexagen Conformance"
description: >
  Run hexagen-lint --ratchet (per-PR baseline diff + machine-enforced
  baseline growth) and hexagen sync --check. Comments only THIS PR's new
  violations; silent when clean.

inputs:
  lint-command:
    description: >
      Shell command that runs the linter. Extra flags --pr-diff,
      --comment-file, and --base-ref are appended on pull_request.
    required: false
    default: "hexagen-lint --ratchet"
  check-command:
    description: Shell command for the sync drift gate. Ignored when skip-sync-check is true.
    required: false
    default: "hexagen sync --check"
  skip-sync-check:
    description: Set "true" to run only the linter (this repo's lint.yml).
    required: false
    default: "false"
  github-token:
    description: Token used to post or update the PR comment. Empty skips commenting.
    required: false
    default: ${{ github.token }}
  working-directory:
    description: Working directory for the lint and check commands.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Fetch PR base ref
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"

    - name: Run hexagen-lint --ratchet
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        COMMENT_FILE="${RUNNER_TEMP:-/tmp}/hexagen-conformance-comment.md"
        echo "comment_file=$COMMENT_FILE" >> "$GITHUB_OUTPUT"
        : > "$COMMENT_FILE"
        extra=()
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          extra+=(--pr-diff --base-ref "origin/${{ github.base_ref }}" --comment-file "$COMMENT_FILE")
        fi
        # Word-split the configured command (it is a trusted workflow input,
        # not user text) then append the PR-diff flags the 0.10.0 contract
        # documents. 0.9.0 binaries do not accept these flags.
        # shellcheck disable=SC2086
        ${{ inputs.lint-command }} "${extra[@]}"

    - name: Run hexagen sync --check
      if: inputs.skip-sync-check != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        ${{ inputs.check-command }}

    - name: Comment only this PR's violations
      if: always() && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMENT_FILE: ${{ steps.lint.outputs.comment_file }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/post-comment.mjs"
