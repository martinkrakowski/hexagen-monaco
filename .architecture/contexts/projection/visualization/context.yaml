name: visualization
type: supporting
description: Interactive architecture graph, module dependency view, DDD canvas
layers:
  domain:
    value_objects:
      - GraphLayoutOptions
      - HexagonNode
      - HexagonNodeWithLayout
      - HexagonEdge
      - CanvasViewport
  application:
    use_cases:
      - RenderHexagonCanvasUseCase
      - ExportGraphImageUseCase
      - CanvasGraphLoadUseCase
    ports:
      in:
        - RenderHexagonCanvasPort
        - ExportGraphImagePort
        - GenerateHexagonalMapPort
      out:
        - IArchitectureGraphProviderPort
depends_on:
  - project-configuration
plane: projection
