name: visualization
type: supporting
description: Interactive architecture graph, module dependency view, DDD canvas
layers:
  domain:
    value_objects:
      - GraphLayoutOptions
      - HexagonNode
      - HexagonNodeWithLayout
      - HexagonEdge
      - CanvasViewport
  application:
    use_cases:
      - RenderHexagonCanvasUseCase
      - ExportGraphImageUseCase
      - CanvasGraphLoadUseCase
    ports:
      in:
        - RenderHexagonCanvasPort
        - ExportGraphImagePort
      out:
        - IArchitectureGraphProviderPort
        # Driven, per ADR-0048's rule of thumb: an infrastructure adapter
        # implements it (HexagonalMapGeneratorAdapter, in this package's
        # infrastructure/adapters/hexagonal-map-generator/) and the use case
        # takes it as a constructor dependency (CanvasGraphLoadUseCase). Same
        # test that keeps TransactionManagerPort off mcp-server's inbound list.
        # Interface: application/ports/out/generate-hexagonal-map.port.ts (HEX-018).
        - GenerateHexagonalMapPort
depends_on:
  - project-configuration
plane: projection
