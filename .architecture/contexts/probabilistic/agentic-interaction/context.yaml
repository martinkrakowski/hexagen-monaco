name: agentic-interaction
type: supporting
description: Assistant integration — ports for LLM providers, suggestion engine, cloud chat, and architecture modification pipeline orchestration (Phase 5)
layers:
  domain:
    value_objects:
      - Suggestion
      - ConfidenceScore
      - CloudProviderEndpoint
      - ProviderFallbackChain
      - DecisionAdviceRequest
      - DecisionAdviceField
      - DecisionAdviceResult
      - DecisionQuestion
      - DecisionQuestions
      - ChoiceQuestion
      - NoulQuestion
      - DecisionAnswer
      - ChoiceAnswer
      - NoulAnswer
      - DecisionUnknownReason
      - DecisionReceipt
  application:
    use_cases:
      - ModifyArchitectureUseCase
      - GenerateSuggestionUseCase
      - ExecuteLooseSpecConversionUseCase
      - ClassifyContextTypeUseCase
      - ExecuteFullStagedGenerationUseCase
      - ExecuteManifestRepairUseCase
    ports:
      in:
        - ArchitectureModificationPort
        - ClassifyContextTypePort
      out:
        - LLMProviderPort
        - SuggestionEnginePort
        - CloudLLMProviderPort
        - SecretVaultPort
        - DecisionAdvicePort
  infrastructure:
    adapters:
      - OpenAICompatibleAdapter
      - CloudLLMPipelineAdapter
      - InMemoryNLParserAdapter
      - InMemoryPromptCompilerAdapter
      - InMemoryLLMSenderAdapter
      - InMemoryReconciliationAdapter
      - InMemoryManifestMutationAdapter
      - InMemoryLintValidationAdapter
      - StaticProviderCatalogAdapter
      - NullDecisionAdapter
depends_on:
  - local-llm
  - ai-pipeline
  - prompt-compiler
  - reconciliation-engine
  - transaction-system
plane: probabilistic
