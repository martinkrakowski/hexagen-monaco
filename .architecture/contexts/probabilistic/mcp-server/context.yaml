name: mcp-server
type: core
description: MCP server — exposes architectural tools and resources over stdio transport for external tool interaction (audit, scaffold, dependency management, governance reads, manifest diff)
layers:
  domain: {}
  application:
    use_cases:
      - GetManifestResourceUseCase
      - GetGraphResourceUseCase
      - GetLinterReportResourceUseCase
      - GetDecisionsResourceUseCase
      - GetInvariantsResourceUseCase
      - GetLinterConfigResourceUseCase
      - GetWorkspaceContextResourceUseCase
      - CreateContextToolUseCase
      - DiffManifestToolUseCase
      - AuditBoundariesToolUseCase
      - ScaffoldModuleToolUseCase
      - AddDependencyToolUseCase
      - CreatePortToolUseCase
      - CreateAdapterToolUseCase
      - RemovePortToolUseCase
      - RemoveContextToolUseCase
      - InitializeFeatureWorktreeToolUseCase
      - SubmitArchitecturalSpecToolUseCase
      - LogAgentRemediationToolUseCase
      - GetTransactionToolUseCase
      - ListTransactionsToolUseCase
      - AcceptTransactionToolUseCase
      - RejectTransactionToolUseCase
      - GenerateTopologyToolUseCase
      - GenerateAdaptersToolUseCase
      - GenerateManifestPipelineToolUseCase
    ports:
      in:
        - MCPServerPort
        # Manifest-structure tool family (item 6.5a / HEX-019). Each is
        # implemented by its use case and called by the tool handler, with no
        # infrastructure implementer — inbound under ADR-0048.
        - CreateContextToolPort
        - RemoveContextToolPort
        - CreatePortToolPort
        - RemovePortToolPort
        - CreateAdapterToolPort
        - AddDependencyToolPort
        - DiffManifestToolPort
        # Transaction-lifecycle tool family (item 6.5b / HEX-019). Same test:
        # implemented by its use case, called by the tool handler, no
        # infrastructure implementer. The driven collaborator stays
        # TransactionManagerPort, which transaction-system owns and which is
        # outbound here — deliberately not listed.
        - AcceptTransactionToolPort
        - RejectTransactionToolPort
        - GetTransactionToolPort
        - ListTransactionsToolPort
        # Generation & scaffold tool family (item 6.5c / HEX-019). Same test:
        # implemented by its use case, called by the tool handler, no
        # infrastructure implementer. ScaffoldModuleToolUseCase is still
        # handed TransactionManagerPort as a driven collaborator — outbound
        # here, deliberately not listed.
        - ScaffoldModuleToolPort
        - GenerateTopologyToolPort
        - GenerateAdaptersToolPort
        - GenerateManifestPipelineToolPort
      out:
        - ProjectConfigurationReadPort
        - ManifestWritePort
        - LinterPort
        - ArchitectureQueryPort
        - ScaffoldingPort
        - GovernanceReadPort
        - ManifestDiffPort
        - ReportGovernancePort
        - ManifestGenerationPort
  infrastructure:
    adapters:
      - MCPServerAdapter
      - ProjectConfigurationReadAdapter
      - ManifestWriteAdapter
      - LinterAdapter
      - SyncEngineAdapter
      - InMemoryEventBusAdapter
      - GovernanceReadAdapter
      - ManifestDiffAdapter
      - ReportGovernanceAdapter
      - OpenAIManifestGenerationAdapter
depends_on:
  - shared
  - messaging
  - project-configuration
  - governance
  - visualization
  - sync
  - report-governance
  - transaction-system
  - agentic-interaction
plane: probabilistic
