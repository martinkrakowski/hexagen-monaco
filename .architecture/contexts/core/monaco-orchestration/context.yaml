name: monaco-orchestration
type: core
description: Semantic code editing with patch-based mutations, confidence gating, undo
layers:
  domain:
    entities:
      - MonacoSession
    value_objects:
      - SemanticPatch
      - ConfidenceScore
      - PatchIntentMetadata
  application:
    use_cases:
      - ApplySemanticPatchUseCase
      - ValidatePatchIntentUseCase
      - UndoLastPatchUseCase
      - ProjectCurrentBufferStateUseCase
    ports:
      # No inbound ports: no use case in this context implements a port — all
      # four take one by constructor injection, so under ADR-0048 they are
      # driven. See ADR-0057: this list is a curated ownership registry and
      # accuracy is the invariant, so an empty `in:` is omitted rather than
      # carried as an empty key.
      out:
        - TsMorphPort
        - ValidatePatchIntentPort
        - UndoLastPatchPort
        - ProjectCurrentBufferStatePort
        - ApplySemanticPatchPort
plane: core
