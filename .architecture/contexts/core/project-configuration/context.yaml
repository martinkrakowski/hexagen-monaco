name: project-configuration
type: core
description: Governance core — manifest parsing, validation, project topology
layers:
  domain:
    entities:
      - ProjectSpec
      - BoundedContext
      - Entity
      - ValueObject
      - Port
      - UseCase
      - Adapter
      - Driver
    value_objects:
      - ManifestSchemaVersion
  application:
    use_cases:
      - GenerateProjectUseCase
      - ValidateSpecUseCase
      - RenderManifestUseCase
    ports:
      in:
        # ValidateSpecUseCase and RenderManifestUseCase implement these, so
        # they are genuinely inbound under ADR-0048.
        - ValidateSpecPort
        - RenderManifestPort
      out:
        - DownloadProviderPort
        - TelemetryPort
        - GenerateProjectPort
  infrastructure:
    adapters: []
plane: core
