name: wizard-orchestration
type: core
description: Deterministic wizard flows, intent processing, state projections
layers:
  domain:
    entities:
      - WizardSession
    value_objects:
      - WizardStep
      - IntentPayload
      - ProjectionViewModel
      - ActiveWorkspace
  application:
    use_cases:
      - ProcessIntentUseCase
      - ProjectWizardStateUseCase
      - ValidateStepUseCase
    ports:
      in:
        # IProjectWizardController is implemented by the React UI and a test
        # fake — both drivers, not infrastructure — so it is genuinely inbound.
        # The three ActiveWorkspacePort contracts have no in-tree implementer
        # and no in-tree consumer, so ADR-0048's test fires in neither
        # direction; their authoring commit records the React context as the
        # adapter, which is a driving adapter.
        - IProjectWizardController
        - QueryActiveWorkspacePort
        - SetActiveWorkspacePort
        - ClearActiveWorkspacePort
      out:
        - WizardCompletionSignalPort
        - ProcessIntentPort
        - ProjectWizardStatePort
        - ValidateStepPort
depends_on:
  - messaging
plane: core
