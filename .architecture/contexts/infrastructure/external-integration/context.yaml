name: external-integration
type: supporting
description: External authentication and identity providers — GitHub OAuth, session management
layers:
  domain:
    value_objects:
      - AuthSession
      - ProviderIdentity
      - GitHubProvider
  application:
    use_cases:
      - InitiateAuthUseCase
      - GetAuthSessionUseCase
      - RevokeAuthUseCase
    ports:
      in:
        - QueryAuthSessionPort
        - InitiateAuthPort
        - RevokeAuthPort
      out:
        - OAuthProviderPort
        - SessionReadPort
plane: infrastructure
infrastructure:
  adapters:
    - GitHubVcsAdapter
    - GitHubExporterAdapter
    - GitHubRepositoryWriterAdapter
    - GitHubGitDataClient
  # Git Data client logic relocated here from project-generation (see github-exporter.adapter.ts)
  # for sharing with RepositoryWriterPort / commitFiles (editor push) without violating project-generation import rules.
ports:
  out:
    - RepositoryWriterPort
    - IVersionControlSystem
    - OAuthProviderPort
    - SessionReadPort
