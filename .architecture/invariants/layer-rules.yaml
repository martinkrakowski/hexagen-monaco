# HexaGen Monaco — Architectural Invariants
# Governs the dependency flow between layers and packages.

# Shared kernels are accessible from all layers in all packages.
# @hexagen/core-domain carries the MVK semantic contracts (DomainAST, NodeKind, EdgeKind, RRP, REM, etc.)
# and is treated as a shared-kernel peer alongside @hexagen/shared.
shared_kernels:
  - package: "@hexagen/shared"
    allowed_in_all_layers: true
  - package: "@hexagen/core-domain"
    allowed_in_all_layers: true
  - package: "@hexagen/runtime"
    allowed_in_all_layers: true

layers:
  domain:
    access_rule: "internal-only"
    allowed_imports: ["@hexagen/shared", "@hexagen/core-domain"]

  application:
    access_rule: "ports-only"
    allowed_imports: ["domain", "@hexagen/shared", "@hexagen/core-domain"]

  infrastructure:
    access_rule: "adapters"
    allowed_imports:
      ["domain", "application", "@hexagen/shared", "@hexagen/core-domain"]

# Cross-Package Boundaries
cross_package_rules:
  - package: "web-driver"
    cannot_import: ["monaco-orchestration"] # Use @hexagen/shared for DTOs instead

composition_root_exceptions:
  - file: "apps/web/app/lib/wire.ts"
    reason: >-
      wire.ts is the app-layer composition root. It imports port types from
      kernel/probabilistic packages and instantiates adapters — this is the
      accepted leak per AR-9 (Medium). No business logic resides here; it
      only satisfies port contracts with adapter instances.
    allowed_imports:
      - "@hexagen/agentic-interaction"
      - "@hexagen/local-llm"
      - "@hexagen/messaging"
      - "@hexagen/visualization"
      - "@hexagen/web-driver"
      - "@hexagen/shared"
