# HexaGen Monaco — Architectural Invariants
# Governs the dependency flow between layers and packages.

# Shared kernels are accessible from all layers in all packages.
# @hexagen/core-domain carries the MVK semantic contracts (DomainAST, NodeKind, EdgeKind, RRP, REM, etc.)
# and is treated as a shared-kernel peer alongside @hexagen/shared.
shared_kernels:
  - package: "@hexagen/shared"
    allowed_in_all_layers: true
  - package: "@hexagen/core-domain"
    allowed_in_all_layers: true
  - package: "@hexagen/runtime"
    allowed_in_all_layers: true

layers:
  domain:
    access_rule: "internal-only"
    allowed_imports:
      [
        "@hexagen/shared",
        "@hexagen/core-domain",
        "@hexagen/project-configuration",
      ]

  application:
    access_rule: "ports-only"
    allowed_imports: ["domain", "@hexagen/shared", "@hexagen/core-domain"]

  infrastructure:
    access_rule: "adapters"
    allowed_imports:
      ["domain", "application", "@hexagen/shared", "@hexagen/core-domain"]

  "manifest-generation/domain":
    access_rule: "internal-only"
    allowed_imports:
      - "@hexagen/shared"
      - "@hexagen/core-domain"
      - "@hexagen/agentic-interaction"
      - "@hexagen/local-llm"

  "manifest-generation/application":
    access_rule: "ports-only"
    allowed_imports:
      - "domain"
      - "@hexagen/shared"
      - "@hexagen/core-domain"
      - "@hexagen/agentic-interaction"
      - "@hexagen/local-llm"

# Cross-Package Boundaries
cross_package_rules:
  - package: "web-driver"
    cannot_import: ["monaco-orchestration"] # Use @hexagen/shared for DTOs instead

composition_root_exceptions:
  - file: "packages/visualization/src/domain/model/architecture-graph/architecture-graph.ts"
    reason: >-
      Imports BoundedContextTypeSchema from @hexagen/project-configuration for
      graph node type classification. This schema was previously in
      @hexagen/shared (allowed in all layers). Moved during Phase 4 schema
      migration to its owning package. The import is a shared-kernel-level
      type dependency, not a business logic coupling.
    allowed_imports:
      - "@hexagen/project-configuration"

  - file: "apps/web/app/lib/wire.ts"
    reason: >-
      wire.ts is the app-layer composition root. It imports port types from
      kernel/probabilistic packages and instantiates adapters — this is the
      accepted leak per AR-9 (Medium). No business logic resides here; it
      only satisfies port contracts with adapter instances.
    allowed_imports:
      - "@hexagen/agentic-interaction"
      - "@hexagen/local-llm"
      - "@hexagen/messaging"
      - "@hexagen/visualization"
      - "@hexagen/web-driver"
      - "@hexagen/shared"

# Driver feature slices inside apps/web/features/ that legitimately wire
# probabilistic / kernel ports into React hooks. These are NOT separate
# workspace packages — they are internal organization of the web-driver app.
# Treated as accepted exceptions alongside wire.ts (AR-9 Medium).
driver_slice_exceptions:
  - slice: "apps/web/features/llm-driver/"
    reason: >-
      React hook + provider glue between @hexagen/local-llm /
      @hexagen/agentic-interaction ports and the UI. The hooks live here
      rather than in a separate workspace package because they are
      framework-bound (React) and only consumed by apps/web. Kernel
      imports are permitted within this directory.
    allowed_imports:
      - "@hexagen/local-llm"
      - "@hexagen/agentic-interaction"
      - "@hexagen/shared"