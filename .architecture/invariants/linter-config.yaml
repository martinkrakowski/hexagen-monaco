# Rules for @hexagen/arch-linter
# Aligning with manifest.yaml 'shared-kernel' type.

global_whitelist:
  - "@hexagen/shared"
  - "@hexagen/shared/**"

# Enforce strict boundaries for drivers
package_rules:
  - name: "web-driver"
    restricted_to:
      - "@hexagen/shared"
      # web-driver should NOT import from monaco-orchestration directly.
      # It should only implement the ports defined in its own domain.
