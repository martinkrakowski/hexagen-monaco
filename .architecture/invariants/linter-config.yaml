# Rules for @hexagen/arch-linter

# TODO: ADR-0037 — normalize @hexagen/local-llm/shared to @hexagen/local-llm/client
# Blocked by: breaking change requiring consumer updates

subpath_conventions:
  server:
    allowed_consumers:
    - sync
    - mcp-server
    - tui
    - api-gateway
    - project-generation
    - arch-linter
  enforcement: error
  require_marker: true
  marker_exclusions: []
client:
    allowed_consumers: []
    enforcement: warn

global_whitelist:
  - '@hexagen/shared'
  - '@hexagen/shared/**'

test_double_rules:
  allowed_cross_package_imports: true

package_rules:
  - name: 'web-driver'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/visualization'
      - '@hexagen/agentic-interaction'
      - '@hexagen/byok'
    composition_root_exceptions:
      - apps/web/app/lib/wire.ts
      - apps/web/app/lib/wire.client.ts
      - apps/web/app/lib/wire.server.ts

  - name: 'sync'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/project-configuration'
      - '@hexagen/visualization'
      - '@hexagen/governance'
      - '@hexagen/core-domain'

  - name: 'project-generation'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/sync'

  - name: 'project-configuration'
    allowed_imports:
      - '@hexagen/shared'

  - name: 'visualization'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/project-configuration'

  - name: 'mcp-server'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/messaging'
      - '@hexagen/project-configuration'
      - '@hexagen/governance'
      - '@hexagen/visualization'
      - '@hexagen/report-governance'
      - '@hexagen/transaction-system'
      - '@hexagen/agentic-interaction'

  - name: 'intent-compiler'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'

  - name: 'ui-projection-compiler'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'

  - name: 'layout-engine'
    allowed_imports: []

  - name: 'runtime'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'

  - name: 'transaction-system'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'
      - '@hexagen/intent-compiler'
      - '@hexagen/sync'

  - name: 'prompt-compiler'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'
      - '@hexagen/project-configuration'
      - '@hexagen/visualization'
      - '@hexagen/governance'

  - name: 'local-llm'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/prompt-compiler'
      - '@hexagen/project-configuration'
      - '@hexagen/visualization'
      - '@hexagen/governance'

  - name: 'reconciliation-engine'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'

  - name: 'ai-pipeline'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'

  - name: 'agentic-interaction'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'
      - '@hexagen/local-llm'
      - '@hexagen/project-configuration'
      - '@hexagen/ai-pipeline'
      - '@hexagen/prompt-compiler'
      - '@hexagen/reconciliation-engine'
      - '@hexagen/transaction-system'

  - name: 'wizard-orchestration'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/messaging'
      - '@hexagen/project-configuration'
      - '@hexagen/sync'

  - name: 'model-settings'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/ui'
      - '@hexagen/local-llm'

  - name: 'manifest-generation'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'
      - '@hexagen/agentic-interaction'
      - '@hexagen/local-llm'

  - name: 'llm-driver'
    allowed_imports:
      - '@hexagen/shared'
      - '@hexagen/core-domain'
      - '@hexagen/local-llm'
      - '@hexagen/byok'
      - '@hexagen/agentic-interaction'
