monorepo:
  packageManager: yarn@4.12.0
  linker: node-modules
  buildTool: turbo
  workspaces:
    - apps/*
    - packages/*
  root:
    hoistDevDependencies: true
    noInternalDeps: true
  eslint:
    extends:
      - turbo
      - prettier
    rules:
      no-console: warn
      '@typescript-eslint/no-explicit-any': error
  tsConfigRootFile: tsconfig.base.json
  tsConfigRoot:
    compilerOptions:
      target: es2022
      lib:
        - es2022
        - dom
        - dom.iterable
      module: esnext
      moduleResolution: bundler
      strict: true
      esModuleInterop: true
      skipLibCheck: true
      forceConsistentCasingInFileNames: true
      composite: true
      baseUrl: .
      resolveJsonModule: true
      isolatedModules: true
      jsx: preserve
      declaration: true
      emitDeclarationOnly: true
      paths:
        '@hexagen/*':
          - packages/*/src/index.ts
        '@hexagen/shared':
          - packages/shared/src/index.ts
        '@hexagen/shared/*':
          - packages/shared/src/*
        '@/*':
          - apps/web/src/*
          - apps/web/app/*
    include: []
    exclude:
      - node_modules
      - dist
      - .next
      - .turbo
  workspaceDefaults:
    tsConfig:
      extends: ../../tsconfig.base.json
      compilerOptions:
        rootDir: src
        outDir: dist
        declaration: true
        emitDeclarationOnly: true
        declarationMap: true
        composite: true
        tsBuildInfoFile: ./dist/tsconfig.tsbuildinfo
        paths: {}
      include:
        - src/**/*
      exclude:
        - node_modules
        - dist
        - .turbo
      references: []
    eslint:
      template: |
        import eslint from '@eslint/js';
        import tseslint from 'typescript-eslint';

        export default tseslint.config(
          eslint.configs.recommended,
          ...tseslint.configs.recommended,
          {
            rules: {
              '@typescript-eslint/no-explicit-any': 'warn',
              '@typescript-eslint/no-unused-vars': ['warn', { argsIgnorePattern: '^_' }],
            },
          },
          {
            ignores: ['dist/**', 'node_modules/**'],
          },
        );
  rootFiles:
    packageJson:
      template: |-
        {
          "name": "{system}",
          "private": true,
          "type": "module",
          "packageManager": "{packageManager}",
          "workspaces": {workspaces},
          "scripts": {
            "build": "turbo build",
            "dev": "turbo dev",
            "lint": "turbo lint",
            "typecheck": "turbo typecheck",
            "test": "turbo test",
            "clean": "turbo clean",
            "sync": "hexagen sync",
            "sync:dry": "hexagen sync --dry-run",
            "sync:force": "hexagen sync --force",
            "lint:arch": "hexagen arch validate",
            "format": "prettier --write \"**/*.{ts,tsx,md}\""
          },
          "devDependencies": {
            "turbo": "^2.0.0",
            "typescript": "^5.5.4",
            "eslint": "^9.0.0",
            "prettier": "^3.0.0",
            "@hexagen/sync": "^0.1.0",
            "@hexagen/arch-linter": "^0.1.0"
          }
        }
    tsConfig:
      template: |-
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "ESNext",
            "moduleResolution": "bundler",
            "strict": true,
            "composite": true,
            "declaration": true,
            "emitDeclarationOnly": true,
            "paths": {
              "@hexagen/*": [
                "./packages/*/src/index.ts"
              ]
            }
          }
        }
    turbo:
      template: |-
        {
          "$schema": "https://turbo.build/schema.json",
          "tasks": {
            "build": {
              "dependsOn": [
                "^build"
              ],
              "outputs": [
                "dist/**"
              ]
            },
            "dev": {
              "cache": false,
              "persistent": true
            },
            "lint": {
              "dependsOn": [
                "^build"
              ]
            },
            "typecheck": {
              "outputs": [],
              "cache": true
            },
            "test": {
              "dependsOn": [
                "^build"
              ]
            }
          }
        }
  archInvariants:
    layerRules:
      template: |
        # HexaGen — Architectural Invariants
        # Template: {template} (flexible mode)

        shared_kernel:
          package: "@{scope}/shared"
          allowed_in_all_layers: true

        layers:
          domain:
            access_rule: "internal-only"
            allowed_imports: ["@{scope}/shared"]

          application:
            access_rule: "ports-only"
            allowed_imports: ["domain", "@{scope}/shared"]

          infrastructure:
            access_rule: "adapters"
            allowed_imports: ["domain", "application", "@{scope}/shared"]
    linterConfig:
      template: |
        # Rules for @hexagen/arch-linter
        # Template: {template} (flexible mode)

        global_whitelist:
          - "@{scope}/shared"
          - "@{scope}/shared/**"

        test_double_rules:
          allowed_cross_package_imports: true

        package_rules:
          - name: 'web-driver'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/visualization'
              - '@hexagen/agentic-interaction'
              - '@hexagen/byok'

          - name: 'sync'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/project-configuration'
              - '@hexagen/visualization'
              - '@hexagen/governance'
              - '@hexagen/core-domain'

          - name: 'project-generation'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/sync'

          - name: 'project-configuration'
            allowed_imports:
              - '@hexagen/shared'

          - name: 'visualization'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/project-configuration'

          - name: 'mcp-server'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/messaging'
              - '@hexagen/project-configuration'
              - '@hexagen/governance'
              - '@hexagen/visualization'
              - '@hexagen/report-governance'
              - '@hexagen/transaction-system'

          - name: 'intent-compiler'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/core-domain'

          - name: 'ui-projection-compiler'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/core-domain'

          - name: 'layout-engine'
            allowed_imports: []

          - name: 'runtime'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/core-domain'

          - name: 'transaction-system'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/core-domain'
              - '@hexagen/intent-compiler'
              - '@hexagen/sync'

          - name: 'prompt-compiler'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/core-domain'
              - '@hexagen/project-configuration'
              - '@hexagen/visualization'
              - '@hexagen/governance'

          - name: 'local-llm'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/prompt-compiler'
              - '@hexagen/project-configuration'
              - '@hexagen/visualization'
              - '@hexagen/governance'

          - name: 'manifest-generation'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/agentic-interaction'
              - '@hexagen/local-llm'

          - name: 'reconciliation-engine'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/core-domain'

          - name: 'ai-pipeline'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/core-domain'

          - name: 'agentic-interaction'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/core-domain'
              - '@hexagen/local-llm'
              - '@hexagen/project-configuration'
              - '@hexagen/ai-pipeline'
              - '@hexagen/prompt-compiler'
              - '@hexagen/reconciliation-engine'
              - '@hexagen/transaction-system'

          - name: 'wizard-orchestration'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/messaging'
              - '@hexagen/project-configuration'
              - '@hexagen/sync'

          - name: 'model-settings'
            allowed_imports:
              - '@hexagen/shared'
              - '@hexagen/ui'
              - '@hexagen/local-llm'
    generatorConfig:
      template: |
        generator:
          version: "1.0"
          description: "Global invariants and safety rules"
          workspace_template: "{workspaceTemplate}"

          invariants:
            - name: composite-safety
              description: "Every tsconfig.json must contain paths: {{}} to override inherited source mappings."
              priority: critical
              failure: abort-and-cleanup

            - name: barrel-ownership-boundary
              description: "Barrels may only re-export types owned by the current bounded context."
              priority: critical
              failure: abort-and-cleanup

            - name: port-single-ownership
              description: "Each port interface belongs to exactly one bounded context."
              priority: critical
              failure: abort-and-cleanup

            - name: dependency-consistency
              description: "Every @hexagen/* import must have a matching entry in package.json."
              priority: high
              failure: abort

            - name: self-import-prevention
              description: "No package imports itself by name."
              priority: high
              failure: abort

            - name: signature-synchronization
              description: "Generated consumers must derive exact signatures from the canonical port."
              priority: high
              failure: abort

            - name: no-empty-stubs
              description: "No empty barrels (export {{}}) in src/."
              priority: medium
              failure: warn-and-continue

            - name: exports-field-mandatory
              description: "Every package.json must include a complete exports map."
              priority: medium
              failure: warn-and-continue

            - name: test-double-parity
              description: "Test doubles must implement the same interface as the canonical port."
              priority: medium
              failure: warn-and-continue

          bootstrap-sequence:
            - load-ownership-map
            - validate-port-ownership-map
            - generate-package-skeleton
            - enforce-tsconfig-paths-override
            - generate-exports-field
            - synchronize-signatures
            - validate-barrel-chain
            - enforce-dependency-consistency
            - final-composite-reference-check

          failure-behavior:
            critical: abort-and-cleanup
            high: abort
            medium: warn-and-continue

          ownership-registry:
            ports:
        {ownershipBlock}
  turboConfig:
    globalDependencies:
      - '**/.env.*'
    pipeline:
      clean:
        cache: false
      build:
        dependsOn:
          - ^build
        outputs:
          - dist/**
          - .next/**
          - '!.next/cache/**'
      lint:
        dependsOn:
          - ^build
      test:
        dependsOn:
          - ^build
      dev:
        cache: false
        persistent: true
      typecheck:
        outputs: []
        cache: true
generator:
  version: 0.2.0
  sync:
    idempotent: true
    createOnlyIfMissing: true
    nonDestructive: true
    protectedRootFiles:
      - .gitignore
      - turbo.json
      - yarn.lock
      - .architecture/
      - .architecture/manifest.yaml
      - .architecture/workspace.config.yaml
      - .architecture/generator.config.yaml
      - README.md
      - .env
      - .env.local
      - .env.development
      - .env.production
      - .env.test
    layers:
      domain:
        folder: src/domain
      application:
        folder: src/application
        subfolders:
          - ports/in
          - ports/out
          - use-cases
      infrastructure:
        folder: src/infrastructure
        subfolders:
          - adapters
    packageJson:
      mergeStrategy: preserveExisting
      protectedKeys:
        - private
        - version
        - license
        - scripts
        - dependencies
        - devDependencies
        - peerDependencies
        - optionalDependencies
        - main
        - module
        - types
        - exports
        - bin
      injectIfMissing:
        scripts:
          build: tsc
          lint: eslint src --ext .ts,.tsx
          typecheck: tsc --noEmit
        devDependencies:
          typescript: ^5.5.4
          eslint: ^9.0.0
          '@typescript-eslint/parser': ^8.0.0
          '@typescript-eslint/eslint-plugin': ^8.0.0
          eslint-config-prettier: ^9.1.0
    stubs:
      enabled: false
      templates:
        inPort: |
          // @generated in-port stub — edit freely
          export interface {name}Port {}
        outPort: |
          // @generated out-port stub — edit freely
          export interface {name}Port {}
        adapter: |
          // @generated adapter stub — edit freely
          export class {name}Adapter {}
        useCase: |
          // @generated use-case stub — edit freely
          export class {name}UseCase {}
        entity: |
          // @generated entity stub — edit freely
          export class {name} {}
        valueObject: |
          // @generated value-object stub — edit freely
          export type {name} = unknown;
        domainService: |
          // @generated domain-service stub — edit freely
          export class {name}Service {}
      naming:
        inPort: '{name}.in-port.ts'
        outPort: '{name}.out-port.ts'
        adapter: '{name}.adapter.ts'
        useCase: '{name}.use-case.ts'
        entity: '{name}.ts'
        valueObject: '{name}.vo.ts'
        domainService: '{name}.service.ts'
    apps:
      frameworks:
        next.js:
          packageJson:
            template: |
              {
                "name": "@{system}/{appName}",
                "version": "0.0.0",
                "private": true,
                "type": "module",
                "scripts": {
                  "build": "next build",
                  "dev": "next dev",
                  "lint": "eslint src --ext .ts,.tsx",
                  "typecheck": "tsc --noEmit"
                },
                "dependencies": {
                  "next": "^15.0.0",
                  "react": "^19.0.0",
                  "react-dom": "^19.0.0"
                },
                "devDependencies": {
                  "typescript": "^5.5.4",
                  "eslint": "^9.0.0",
                  "@typescript-eslint/parser": "^8.0.0",
                  "@typescript-eslint/eslint-plugin": "^8.0.0"
                }
              }
          tsConfig:
            extends: ../../tsconfig.base.json
            compilerOptions:
              rootDir: src
              outDir: dist
              composite: true
              declaration: true
              emitDeclarationOnly: true
              jsx: react-jsx
            include:
              - src/**/*
            exclude:
              - node_modules
              - dist
          entryPoint:
            path: src/app/page.tsx
            template: |
              // Auto-generated Next.js application
              export default function HomePage() {
                return <div>Welcome to {system}</div>;
              }
        fastify:
          packageJson:
            template: |
              {
                "name": "@{system}/{appName}",
                "version": "0.0.0",
                "private": true,
                "type": "module",
                "scripts": {
                  "build": "tsc",
                  "dev": "tsc --watch",
                  "lint": "eslint src --ext .ts,.tsx",
                  "typecheck": "tsc --noEmit"
                },
                "dependencies": {
                  "fastify": "^5.0.0"
                },
                "devDependencies": {
                  "typescript": "^5.5.4",
                  "eslint": "^9.0.0",
                  "@typescript-eslint/parser": "^8.0.0",
                  "@typescript-eslint/eslint-plugin": "^8.0.0"
                }
              }
          tsConfig:
            extends: ../../tsconfig.base.json
            compilerOptions:
              rootDir: src
              outDir: dist
              composite: true
              declaration: true
              emitDeclarationOnly: true
              jsx: preserve
            include:
              - src/**/*
            exclude:
              - node_modules
              - dist
          entryPoint:
            path: src/index.ts
            template: |
              // Auto-generated Fastify application
              import fastify from 'fastify';

              const server = fastify();

              server.get('/', async () => {
                return { status: 'ok' };
              });

              export default server;
        plain-ts:
          packageJson:
            template: |
              {
                "name": "@{system}/{appName}",
                "version": "0.0.0",
                "private": true,
                "type": "module",
                "scripts": {
                  "build": "tsc",
                  "dev": "tsc --watch",
                  "lint": "eslint src --ext .ts,.tsx",
                  "typecheck": "tsc --noEmit"
                },
                "dependencies": {},
                "devDependencies": {
                  "typescript": "^5.5.4",
                  "eslint": "^9.0.0",
                  "@typescript-eslint/parser": "^8.0.0",
                  "@typescript-eslint/eslint-plugin": "^8.0.0"
                }
              }
          tsConfig:
            extends: ../../tsconfig.base.json
            compilerOptions:
              rootDir: src
              outDir: dist
              composite: true
              declaration: true
              emitDeclarationOnly: true
            include:
              - src/**/*
            exclude:
              - node_modules
              - dist
          entryPoint:
            path: src/index.ts
            template: |
              // Auto-generated plain-TypeScript application entry point
              export function main(): void {
                // Application bootstrap for {appName}
              }
