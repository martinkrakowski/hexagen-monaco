generator:
  version: '1.0'
  description: 'Global invariants and safety rules that apply to every generated project and slice'

  invariants:
    - name: composite-safety
      description: "Every generated package tsconfig.json must contain 'paths': {} to override inherited source mappings. Validate that all cross-package references point to dist/index.d.ts only."
      priority: critical
      enforcement: bootstrap
      failure: abort-and-cleanup

    - name: barrel-ownership-boundary
      description: 'Barrels may only re-export types owned by the current bounded context (upward reachability). Never re-export types from another package (downward ownership boundary). Validate both directions.'
      priority: critical
      failure: abort-and-cleanup

    - name: port-single-ownership
      description: 'Each port interface belongs to exactly one bounded context. No duplicates. Generator maintains and auto-updates a central ownership map in generator.config.yaml.'
      priority: critical
      failure: abort-and-cleanup

    - name: dependency-consistency
      description: 'Every @hexagen/* import must have a matching entry in package.json dependencies. Generator auto-adds missing dependencies.'
      priority: high
      failure: abort

    - name: self-import-prevention
      description: 'No package imports itself by name. Convert to relative paths automatically.'
      priority: high
      failure: abort

    - name: signature-synchronization
      description: 'Generated consumers must derive exact signatures from the canonical port at generation time. Read port definition before generating callers.'
      priority: high
      failure: abort

    - name: no-empty-stubs
      description: 'No empty barrels (export {}) or debug scaffolding files in src/. Omit barrel file entirely until it has real exports.'
      priority: medium
      enforcement: generation-time
      failure: warn-and-continue

    - name: exports-field-mandatory
      description: 'Every package.json must include a complete exports map for subpath imports. Main and types point to dist/index.js and dist/index.d.ts.'
      priority: medium
      failure: warn-and-continue

    - name: test-double-parity
      description: 'Every file placed under __tests__/doubles/ must implement exactly the same interface as the canonical port it fakes. Must return Result<T,E> and must not add extra methods or change signatures.'
      priority: medium
      enforcement: bootstrap
      failure: warn-and-continue

  bootstrap-sequence:
    - load-ownership-map
    - validate-port-ownership-map
    - generate-package-skeleton
    - enforce-tsconfig-paths-override
    - generate-exports-field
    - synchronize-signatures
    - validate-barrel-chain
    - enforce-dependency-consistency
    - final-composite-reference-check

  failure-behavior:
    critical: abort-and-cleanup
    high: abort
    medium: warn-and-continue

  ownership-registry:
    # Auto-maintained — generator updates this section when new ports are created.
    # Convention: PascalCase throughout, matching manifest.yaml bounded_contexts declarations.
    # Source of truth is manifest.yaml bounded_contexts[*].layers.application.ports
    ports:
      # shared-kernel
      # (no ports declared)

      # project-configuration — in-ports
      TelemetryPort: project-configuration
      GenerateProjectPort: project-configuration
      RenderManifestPort: project-configuration
      ValidateSpecPort: project-configuration
      # project-configuration — out-ports
      ProjectGeneratorPort: project-configuration
      DownloadProviderPort: project-configuration

      # sync — in-ports
      GeneratorPort: sync

      # wizard-orchestration — in-ports
      ProcessIntentPort: wizard-orchestration
      ProjectWizardStatePort: wizard-orchestration
      ValidateStepPort: wizard-orchestration
      # wizard-orchestration — out-ports
      WizardPersistencePort: wizard-orchestration
      WizardTelemetryPort: wizard-orchestration
      MonacoSyncPort: wizard-orchestration

      # monaco-orchestration — in-ports
      ValidatePatchIntentPort: monaco-orchestration
      UndoLastPatchPort: monaco-orchestration
      ProjectCurrentBufferStatePort: monaco-orchestration
      ApplySemanticPatchPort: monaco-orchestration
      # monaco-orchestration — out-ports
      MonacoPersistencePort: monaco-orchestration
      SemanticModelAdapterPort: monaco-orchestration
      TsMorphPort: monaco-orchestration

      # visualization — in-ports
      RenderGraphProjectionPort: visualization
      ExportGraphImagePort: visualization
      # visualization — out-ports
      ArchitectureGraphProviderPort: visualization

      # messaging — out-ports
      EventBusPort: messaging
      IntentBusPort: messaging

      # persistence
      # (no ports declared — adapters only)

      # agentic-interaction — out-ports
      LLMProviderPort: agentic-interaction
      SuggestionEnginePort: agentic-interaction

      # web-driver — out-ports
      DownloadProjectPort: web-driver

      # project-generation — in-ports
      RunProjectGenerationPort: project-generation

  diagram-notes:
    - 'Diagram omits medium-priority steps (no-empty-stubs, exports-field-mandatory) as they are not exercised by the main happy path.'
    - 'All critical/high steps have explicit failure routing. Medium steps are warn-and-continue only.'
