agent_instructions:
  read_order:
    - manifest.yaml
    - workspace.config.yaml
    - invariants/layer-rules.yaml
    - contexts/{plane}/{target}/context.yaml
  never_load_in_parallel:
    - contexts/frozen/
relationship_patterns:
  U/D:
    description: Upstream/Downstream — the upstream team has independent power to decide what gets published; the downstream team must conform or invest in a translator.
    acl_required: optional
    linter: enforce-dependency-direction
  ACL:
    description: Anti-Corruption Layer — a translation boundary that prevents upstream model concepts from leaking into the downstream bounded context.
    acl_required: true
    linter: enforce-adapter-exists
  SK:
    description: Shared Kernel — a deliberately shared subset of the domain model, maintained by mutual agreement. Must exist in the global_whitelist.
    acl_required: false
    linter: enforce-global-whitelist
  P:
    description: Partnership — two teams collaborate closely with reciprocal dependency. Both sides must declare the relationship.
    acl_required: false
    linter: enforce-reciprocal-declaration
  OHS:
    description: Open Host Service — the upstream publishes a well-defined protocol/API for any downstream consumer. Replaces ad-hoc integration.
    acl_required: false
    linter: enforce-published-language
