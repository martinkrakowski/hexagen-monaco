system: hexagen-monaco
scope: hexagen
architecture: modular-monolith
monorepo:
  packageManager: yarn@4.12.0
  linker: node-modules
  buildTool: turbo
  workspaces:
    - apps/*
    - packages/*
  root:
    hoistDevDependencies: true
    noInternalDeps: true
  eslint:
    extends:
      - turbo
      - prettier
    rules:
      no-console: warn
      "@typescript-eslint/no-explicit-any": error
  tsConfigRootFile: tsconfig.base.json
  tsConfigRoot:
    compilerOptions:
      target: es2022
      lib:
        - es2022
        - dom
        - dom.iterable
      module: esnext
      moduleResolution: bundler
      strict: true
      esModuleInterop: true
      skipLibCheck: true
      forceConsistentCasingInFileNames: true
      composite: true
      baseUrl: .
      resolveJsonModule: true
      isolatedModules: true
      jsx: preserve
      declaration: true
      emitDeclarationOnly: true
      paths:
        "@hexagen/*":
          - packages/*/src/index.ts
        "@hexagen/shared":
          - packages/shared/src/index.ts
        "@hexagen/shared/*":
          - packages/shared/src/*
        "@/*":
          - apps/web/src/*
          - apps/web/app/*
    include: []
    exclude:
      - node_modules
      - dist
      - .next
      - .turbo
  workspaceDefaults:
    tsConfig:
      extends: ../../tsconfig.base.json
      compilerOptions:
        rootDir: src
        outDir: dist
        declaration: true
        emitDeclarationOnly: true
        declarationMap: true
        composite: true
        tsBuildInfoFile: ./dist/.tsbuildinfo
      include:
        - src/**/*
      exclude:
        - node_modules
        - dist
        - .turbo
      references: []
  turboConfig:
    globalDependencies:
      - "**/.env.*"
    pipeline:
      clean:
        cache: false
      build:
        dependsOn:
          - ^build
        outputs:
          - dist/**
          - .next/**
          - "!.next/cache/**"
      lint:
        dependsOn:
          - ^build
      test:
        dependsOn:
          - ^build
      dev:
        cache: false
        persistent: true
      typecheck:
        outputs: []
        cache: true
generator:
  version: 0.2.0
  sync:
    idempotent: true
    createOnlyIfMissing: true
    nonDestructive: true
    protectedRootFiles:
      - .gitignore
      - turbo.json
      - yarn.lock
      - .architecture/
      - .architecture/manifest.yaml
      - .architecture/generator.config.yaml
      - README.md
      - .env
      - .env.local
      - .env.development
      - .env.production
      - .env.test
    packageJson:
      mergeStrategy: preserveExisting
      protectedKeys:
        - private
        - version
        - license
        - scripts
        - dependencies
        - devDependencies
        - peerDependencies
        - optionalDependencies
        - main
        - module
        - types
        - exports
        - bin
      injectIfMissing:
        scripts:
          build: tsc
          lint: eslint src --ext .ts,.tsx
          typecheck: tsc --noEmit
        devDependencies:
          typescript: ^5.5.4
          eslint: ^9.0.0
          "@typescript-eslint/parser": ^8.0.0
          "@typescript-eslint/eslint-plugin": ^8.0.0
          eslint-config-prettier: ^9.1.0
mvk:
  spec: .architecture/mvk/spec-v1.md
  driftReport: .architecture/mvk/drift-report-v1.md
  decisions:
    - .architecture/decisions/0018-mvk-semantic-kernel-contracts.md
  package: packages/core-domain
planes:
  kernel:
    - core-domain
    - intent-compiler
    - layout-engine
    - ui-projection-compiler
    - transaction-system
    - prompt-compiler
    - architectural-enforcement
    - wizard-orchestration
    - monaco-orchestration
  projection:
    - ui
    - visualization
    - web-driver
  probabilistic:
    - local-llm
    - agentic-interaction
    - reconciliation-engine
    - mcp-server
  infrastructure:
    - persistence
    - messaging
    - external-integration
    - deployment
    - sync
    - runtime
  shared-kernel:
    - shared
    - core-domain
bounded_contexts:
  - name: core-domain
    type: core
    description: >-
      Semantic kernel — MVK contracts, domain AST, governance AST, topology and
      cardinality invariants
    layers:
      domain:
        entities:
          - DomainAST
          - DomainNode
          - DomainEdge
        value_objects:
          - NodeKind
          - EdgeKind
          - TopologyInvariants
          - CardinalityInvariants
          - IntentLineage
          - RRP
          - REM
          - NodeVisualSpec
          - DomainCommand
      application:
        ports:
          in: []
          out: []
      infrastructure:
        adapters: []
  - name: shared
    type: shared-kernel
    description: Shared primitives, custom errors, base classes, utilities
    layers:
      domain:
        value_objects:
          - CustomError
          - Identifier
          - PersistedEditorWorkspace
          - PersistedCanvasLayout
  - name: project-configuration
    type: core
    description: Governance core — manifest parsing, validation, project topology
    layers:
      domain:
        entities:
          - ProjectSpec
          - BoundedContext
          - Entity
          - ValueObject
          - Port
          - UseCase
          - Adapter
          - Driver
        value_objects: []
      application:
        use_cases:
          - GenerateProjectUseCase
          - ValidateSpecUseCase
          - RenderManifestUseCase
        ports:
          in:
            - ValidateSpecPort
            - RenderManifestPort
            - TelemetryPort
            - GenerateProjectPort
            - LoggerPort
          out:
            - ProjectGeneratorPort
            - DownloadProviderPort
      infrastructure:
        adapters: []
    generator:
      dependencies:
        js-yaml: ^4.1.0
        zod: ^3.23.8
  - name: sync
    type: core
    description: >-
      SyncEngine — idempotent regeneration, structured reporting, aggregation of
      generator results
    layers:
      domain:
        entities:
          - GeneratorResult
          - SyncReport
      application:
        use_cases:
          - RunSyncUseCase
          - AggregateGeneratorResultsUseCase
        ports:
          in:
            - GeneratorPort
      infrastructure:
        adapters:
          - FileSystemGeneratorAdapter
          - ArchLinterAdapter
  - name: wizard-orchestration
    type: core
    description: Deterministic wizard flows, intent processing, state projections
    layers:
      domain:
        entities:
          - WizardSession
        value_objects:
          - WizardStep
          - IntentPayload
          - ProjectionViewModel
          - ActiveWorkspace
      application:
        use_cases:
          - ProcessIntentUseCase
          - ProjectWizardStateUseCase
          - ValidateStepUseCase
        ports:
          in:
            - ProcessIntentPort
            - ProjectWizardStatePort
            - ValidateStepPort
            - IProjectWizardController
            - QueryActiveWorkspacePort
            - SetActiveWorkspacePort
            - ClearActiveWorkspacePort
          out:
            - WizardPersistencePort
            - WizardTelemetryPort
            - MonacoSyncPort
            - WizardCompletionSignalPort
    depends_on:
      - messaging
  - name: monaco-orchestration
    type: core
    description: Semantic code editing with patch-based mutations, confidence gating, undo
    layers:
      domain:
        entities:
          - MonacoSession
        value_objects:
          - SemanticPatch
          - ConfidenceScore
          - PatchIntentMetadata
      application:
        use_cases:
          - ApplySemanticPatchUseCase
          - ValidatePatchIntentUseCase
          - UndoLastPatchUseCase
          - ProjectCurrentBufferStateUseCase
        ports:
          in:
            - ValidatePatchIntentPort
            - UndoLastPatchPort
            - ProjectCurrentBufferStatePort
            - ApplySemanticPatchPort
          out:
            - MonacoPersistencePort
            - SemanticModelAdapterPort
            - TsMorphPort
    generator:
      dependencies:
        monaco-editor: ^0.51.0
        ts-morph: ^22.0.0
  - name: visualization
    type: supporting
    description: Interactive architecture graph, module dependency view, DDD canvas
    layers:
      domain:
        value_objects:
          - GraphLayoutOptions
          - NodeVisualStyle
          - HexagonNode
          - HexagonNodeWithLayout
          - HexagonEdge
          - CanvasViewport
      application:
        use_cases:
          - RenderHexagonCanvasUseCase
          - ExportGraphImageUseCase
        ports:
          in:
            - RenderHexagonCanvasPort
            - ExportGraphImagePort
          out:
            - ArchitectureGraphProviderPort
    generator:
      dependencies:
        "@dagrejs/dagre": ^2.0.4
  - name: external-integration
    type: supporting
    description: >-
      External authentication and identity providers — GitHub OAuth, session
      management
    layers:
      domain:
        value_objects:
          - AuthSession
          - ProviderIdentity
          - GitHubProvider
      application:
        use_cases:
          - InitiateAuthUseCase
          - GetAuthSessionUseCase
          - RevokeAuthUseCase
        ports:
          in:
            - QueryAuthSessionPort
            - InitiateAuthPort
            - RevokeAuthPort
          out:
            - OAuthProviderPort
            - SessionReadPort
  - name: messaging
    type: supporting
    description: Domain events, intent bus, pluggable transports
    layers:
      domain:
        value_objects:
          - DomainEvent
          - Intent
      application:
        ports:
          out:
            - EventBusPort
            - IntentBusPort
  - name: persistence
    type: supporting
    description: >-
      Architecture snapshots, manifest versioning, change history, evolution
      ledger
    layers:
      domain:
        entities:
          - Snapshot
          - Version
      infrastructure:
        adapters: []
  - name: agentic-interaction
    type: supporting
    description: >-
      AI assistant integration — ports for LLM providers, suggestion engine,
      cloud chat
    layers:
      domain:
        value_objects:
          - Suggestion
          - ConfidenceScore
      application:
        ports:
          out:
            - LLMProviderPort
            - SuggestionEnginePort
            - CloudLLMProviderPort
            - SecretVaultPort
      infrastructure:
        adapters:
          - OpenAICompatibleAdapter
    depends_on:
      - local-llm
  - name: web-driver
    type: driver
    description: Next.js frontend — Intent Bus, projections, Monaco wrapper, agentic UI
    layers:
      domain:
        entities:
          - Project
          - MonacoSessionState
        ports:
          out:
            - EditorWorkspacePersistencePort
            - CanvasLayoutPersistencePort
      application:
        use_cases:
          - ProjectViewProjectionUseCase
          - PersistSessionIntentHandler
        factories:
          - createWebUseCaseFactories
      infrastructure:
        adapters:
          - LocalStoragePersistenceAdapter
          - LocalStorageCanvasLayoutAdapter
          - ArchitectureGraphProviderAdapter
    driver_for: apps/web
    generator:
      dependencies:
        "@xyflow/react": ^12.10.1
        react-markdown: ^9.0.0
        remark-gfm: ^4.0.0
        react-syntax-highlighter: ^15.6.0
        "@tailwindcss/typography": ^0.5.0
    depends_on:
      - agentic-interaction
      - monaco-orchestration
      - visualization
      - wizard-orchestration
    wiring:
      - Intent Bus dispatches to projections/use-case factories only
      - >-
        MonacoPersistencePort is owned by monaco-orchestration and implemented
        here by LocalStoragePersistenceAdapter
      - >-
        ArchitectureGraphProviderPort is owned by visualization and implemented
        here by ArchitectureGraphProviderAdapter (stub — returns empty graph)
  - name: llm-driver
    type: driver
    description: >-
      React hooks and providers for the local-llm and agentic-interaction
      bounded contexts. Acts as the application-layer glue code for AI features.
    layers:
      application:
        hooks:
          - useLocalLLM
          - useEngineLifecycle
          - useChatMessages
          - useGovernancePayload
    driver_for: apps/web
    depends_on:
      - local-llm
      - agentic-interaction
      - shared
  - name: project-generation
    type: core
    description: >-
      Project scaffolding engine — generates full project structure from
      specification
    layers:
      domain:
        value_objects:
          - ProjectSpecification
          - ExportIntent
      application:
        use_cases:
          - GenerateProjectUseCase
          - InitiateExportUseCase
      ports:
        in:
          - RunProjectGenerationPort
          - InitiateExportPort
        out:
          - ExternalProjectGeneratorPort
          - ZipCreatorPort
          - ProjectExporterPort
      infrastructure:
        adapters:
          - ExternalSyncEngineAdapter
          - JsZipCreatorAdapter
  - name: mcp-server
    type: core
    description: >-
      MCP server — exposes architectural tools and resources over stdio
      transport for AI agent interaction (audit, scaffold, dependency
      management)
    layers:
      domain: {}
      application:
        use_cases:
          - GetManifestResourceUseCase
          - GetGraphResourceUseCase
          - GetLinterReportResourceUseCase
          - AuditBoundariesToolUseCase
          - ScaffoldModuleToolUseCase
          - AddDependencyToolUseCase
          - CreatePortToolUseCase
          - CreateAdapterToolUseCase
          - RemovePortToolUseCase
          - RemoveContextToolUseCase
        ports:
          in:
            - McpServerPort
          out:
            - ProjectConfigurationReadPort
            - ManifestWritePort
            - LinterPort
            - ArchitectureQueryPort
            - ScaffoldingPort
      infrastructure:
        adapters:
          - MCPServerAdapter
          - ProjectConfigurationReadAdapter
          - ManifestWriteAdapter
          - LinterAdapter
          - SyncEngineAdapter
          - InMemoryEventBusAdapter
    depends_on:
      - shared
      - messaging
      - project-configuration
      - sync
  - name: architectural-enforcement
    type: supporting
    status: scaffold
    description: >-
      Architectural enforcement tooling — future home of the ESLint plugin
      and boundary validation rules. Currently scaffold-only.
    layers:
      domain: {}
      application: {}
      infrastructure: {}

  - name: code-generation
    type: supporting
    status: scaffold
    description: >-
      Code generation tooling — future home of template-based code
      generation. Currently scaffold-only.
    layers:
      domain: {}
      application: {}
      infrastructure: {}

  - name: deployment
    type: supporting
    description: Deployment infrastructure — CI/CD pipelines, container definitions
    layers:
      domain: {}
      infrastructure: {}

  - name: local-llm
    type: supporting
    description: >-
      Browser-based WebGPU LLM inference via WebLLM (MLC AI). Provides
      offline-capable local AI inference with worker-based architecture and
      IndexedDB model caching. Enforces ACL: all LLM inputs must come through
      prompt-compiler's structured request port. Schema validation at response
      boundary rejects schema-drift.
    layers:
      domain:
        value_objects:
          - LLMProgress
          - ModelMetadata
          - LLMEngineState
          - HardwareProfile
          - ChatMessage
          - GovernanceEntry
          - DomainModelId
          - LLMRequest
          - LLMResponse
          - SchemaValidationResult
          - ModelCatalog
          - ModelDescriptor
          - CloudProviderCatalog
          - CloudProviderConfig
          - RecommendationResult
          - CompatibilityIssue
      application:
        use_cases:
          - InitializeModelUseCase
          - StreamGenerateUseCase
          - RecommendModelUseCase
        ports:
          in:
            - SendStructuredRequestPort
          out:
            - LocalLLMProviderPort
            - WebGPUDetectorPort
            - HardwareProfilerPort
            - ChatPersistencePort
      infrastructure:
        adapters:
          - WebLLMAdapter
          - WebGPUCapabilityAdapter
          - BrowserHardwareProfilerAdapter
          - IDBChatPersistenceAdapter
    generator: { dependencies: { "@mlc-ai/web-llm": "^0.2.0" } }
    depends_on:
      - prompt-compiler
      - shared
  - name: ui
    type: supporting
    description: >-
      Projection layer — UI atoms, tokens, controllers isolated from semantic
      state via 3-layer information firewall
    layers:
      domain:
        types:
          - ForbiddenBrandHelpers
          - InformationStateBrand
          - ForbiddenToken
          - InteractionStateOnly
          - NoSemanticState
      infrastructure:
        adapters: []
      presentation:
        elements:
          - Badge
          - Button
          - Card
          - Icon
          - Input
          - Label
          - Textarea
        controllers:
          - useDialog
          - useDisclosure
          - useFocusTrap
          - usePress
          - useRovingTabIndex
        modules:
          - FileDropZone
          - Tabs
          - ViewToggle
        sections:
          - Dialog
        tokens:
          - ProjectionToken
  - name: intent-compiler
    type: core
    description: >-
      Semantic intent compilation pipeline — gesture parsing, topology and
      cardinality invariant validation, rejection emission
    layers:
      domain:
        entities:
          - Gesture
          - Rejection
        value_objects:
          - ParsedGesture
          - TopologyCheckResult
          - CardinalityCheckResult
      application:
        use_cases:
          - ParseGestureUseCase
          - ValidateTopologyUseCase
          - ValidateCardinalityUseCase
          - EmitRejectionUseCase
        ports:
          in:
            - GestureParserPort
            - TopologyCheckerPort
            - CardinalityCheckerPort
            - RejectEmitterPort
          out: []
      infrastructure:
        adapters: []
    depends_on:
      - core-domain
      - runtime
      - shared
  - name: layout-engine
    type: core
    description: >-
      Geometric constraint solver — hexagonal context map layout, affordance
      resolution, stability scoring, violation detection. Pure geometry only;
      zero semantic coupling to MVK types.
    layers:
      domain:
        value_objects:
          - LayoutConstraint
          - Affordance
          - StabilityScore
          - LayoutResult
      application:
        use_cases:
          - SolveLayoutUseCase
          - ResolveAffordanceUseCase
          - ScoreStabilityUseCase
          - DetectViolationsUseCase
        ports:
          in:
            - SolveLayoutPort
            - ResolveAffordancePort
            - ScoreStabilityPort
            - DetectViolationsPort
          out: []
      infrastructure:
        adapters:
          - DagreLayoutSolverAdapter
          - DefaultAffordanceResolverAdapter
          - DefaultStabilityScorerAdapter
          - DefaultViolationDetectorAdapter
    depends_on:
      - core-domain
      - shared
  - name: ui-projection-compiler
    type: core
    description: >-
      Projection compiler — maps domain node types to visual variants, icons,
      and affordance projections. Resolves realizability and compatibility
      constraints. Zero runtime or projection-framework imports (React/xyflow
      banned).
    layers:
      domain:
        value_objects:
          - VisualVariant
          - IconMapping
          - ProjectionError
          - ProjectionValidationResult
      application:
        use_cases:
          - MapNodeVisualUseCase
          - ResolveVariantUseCase
          - ResolveIconUseCase
          - ProjectAffordanceUseCase
          - CheckRealizabilityUseCase
          - CheckAffordanceCompatibilityUseCase
        ports:
          in:
            - MapNodeVisualPort
            - ResolveVariantPort
            - ResolveIconPort
            - ProjectAffordancePort
            - CheckRealizabilityPort
            - CheckAffordanceCompatibilityPort
          out: []
      infrastructure:
        adapters:
          - CvaVariantResolverAdapter
          - DefaultIconResolverAdapter
          - DefaultNodeVisualMapperAdapter
          - DefaultAffordanceProjectorAdapter
          - DefaultRealizabilityCheckerAdapter
          - DefaultAffordanceCompatibilityAdapter
    depends_on:
      - core-domain
      - intent-compiler
      - shared
  - name: transaction-system
    type: core
    description: >-
      Transaction orchestration — speculative state machine, backpressure
      control, semantic caching for intent processing pipeline
    layers:
      domain:
        entities:
          - Transaction
          - SpeculativeState
        value_objects:
          - TransactionId
          - BackpressureSignal
          - CacheEntry
      application:
        use_cases:
          - ExecuteTransactionUseCase
          - RollbackTransactionUseCase
          - CommitTransactionUseCase
          - QueryCacheUseCase
        ports:
          in:
            - TransactionManagerPort
            - SpeculativeStateMachinePort
            - BackpressureControllerPort
            - SemanticCachePort
          out: []
      infrastructure:
        adapters: []
    depends_on:
      - core-domain
      - intent-compiler
      - shared
  - name: prompt-compiler
    type: core
    description: >-
      Prompt compilation — builds contextual prompts from DomainAST, governance
      rules, and user intent for LLM consumption. Enforces ACL by producing
      schema-validated prompts that are the only legal input to LLM inference.
    layers:
      domain:
        value_objects:
          - PromptTemplate
          - PromptVariable
          - PromptContext
          - SystemInstruction
          - StructuredOutputSchema
          - PromptCacheKey
          - GovernanceQuestionTemplates
          - WizardContextSerializer
      application:
        use_cases:
          - CompilePromptUseCase
          - RenderPromptUseCase
          - CachePromptUseCase
        ports:
          in:
            - PromptCompilerPort
            - BuildSystemInstructionPort
            - GenerateZodSchemaPort
            - CachePromptPort
          out:
            - PromptCachePort
      infrastructure:
        adapters:
          - DefaultPromptCompilerAdapter
          - GroundedPromptBuilderAdapter
          - RRPSystemInstructionBuilderAdapter
          - RRPZodSchemaGeneratorAdapter
          - InMemoryPromptCacheAdapter
          - WizardContextSerializerAdapter
    depends_on:
      - core-domain
      - shared
  - name: reconciliation-engine
    type: core
    description: >-
      Reconciliation Engine — parses LLM responses and merges them with
      deterministic DomainAST while applying governance constraints.
      Enforces monotonic state transitions and deterministic-kernel authority.
    layers:
      domain:
        value_objects:
          - LLMResponse
          - ReconciliationResult
          - Patch
          - Verdict
          - ReconciliationState
      application:
        use_cases:
          - ReconcileUseCase
          - ApplyPatchUseCase
          - CompareVerdictsUseCase
          - PromoteStateUseCase
          - ResolveConflictUseCase
        ports:
          in:
            - ReconciliationPort
            - CompareVerdictsPort
            - PromoteStatePort
            - ResolveConflictPort
          out: []
      infrastructure:
        adapters:
          - DefaultASTReconciliationAdapter
          - DefaultVerdictComparatorAdapter
          - MonotonicStatePromoterAdapter
          - DefaultConflictResolverAdapter
    depends_on:
      - core-domain
      - prompt-compiler
      - shared
  - name: runtime
    type: shared-kernel
    description: >-
      Runtime type guards and generators for MVK contracts — provides
      runtime validation of DomainAST, NodeKind, EdgeKind, TopologyInvariants,
      CardinalityInvariants, and IntentLineage.
    layers:
      domain:
        value_objects:
          - NodeKindGuard
          - EdgeKindGuard
          - TopologyInvariantGuard
          - CardinalityInvariantGuard
          - IntentLineageRuntime
      infrastructure:
        adapters: []
    depends_on:
      - core-domain
apps:
  - name: web
    driver: next.js
    description: >-
      Frontend application — wizard, monaco editor, agentic UI, visualization
      canvas
    depends_on:
      - shared
      - project-configuration
      - wizard-orchestration
      - monaco-orchestration
      - visualization
      - sync
  - name: api-gateway
    driver: fastify
    description: Public HTTP API + command gateway (future phase)
    depends_on:
      - project-configuration
      - messaging
      - shared
